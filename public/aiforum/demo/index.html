  if (a === "copy") {
    const src = document.getElementById(el.dataset.src); const txt = src ? src.textContent : "";
    let ok = true; try { await navigator.clipboard.writeText(txt); } catch (err) { ok = false; }
    const old = el.innerHTML; el.classList.add("copied"); el.innerHTML = ok ? `${ic("check", 15, 3)} Copied` : "Select the text to copy";
    setTimeout(() => { el.classList.remove("copied"); el.innerHTML = old; }, 1800); return;
  }
  if (a === "zoom") { const s = SESSIONS.find((x) => x.n === +el.dataset.n); dialog("Join on Zoom", `<p style="margin-top:8px">${s.title}<br><span class="muted">${DAYS[s.day].date} · ${s.time} to ${s.end} CT</span></p><p class="muted" style="margin-top:10px">In the actual academy, this button opens the Zoom meeting for this session.</p><div class="acts"><button class="btn primary" data-act="close">Got it</button></div>`); return; }
  if (a === "cal") { const s = SESSIONS.find((x) => x.n === +el.dataset.n); dialog("Add to calendar", `<p style="margin-top:8px">${s.title}<br><span class="muted">${DAYS[s.day].date} · ${s.time} to ${s.end} CT</span></p><div class="acts"><a class="btn primary" href="${gcalUrl(s)}" target="_blank" rel="noopener">${ic("calendar", 18)} Google Calendar</a><button class="btn" data-act="close">Close</button></div><p class="hint" style="margin-top:14px">The actual academy will also offer Outlook and one calendar file for all eight sessions.</p>`); return; }
  if (a === "sample") { const [t, d] = SAMPLE[el.dataset.k]; dialog(t, `<p class="muted" style="margin-top:8px">${d}</p><p class="hint" style="margin-top:10px">This is part of the sample.</p><div class="acts"><button class="btn primary" data-act="close">Got it</button></div>`); return; }
  if (a === "jump") { scrollToEl(document.getElementById(el.dataset.to), true); return; }
  if (a === "step") { S.walk[el.dataset.n] = +el.dataset.i; save(); rerender(); return; }
  if (a === "tab") { S.tab[el.dataset.key] = +el.dataset.i; save(); rerender(); return; }
  if (a === "react") { const k = reactKey(el.dataset.id, el.dataset.k); S.reacts[k] = !S.reacts[k]; save(); rerender(); return; }
  if (a === "note") { ui.openNote = ui.openNote === el.dataset.id ? null : el.dataset.id; rerender(); return; }
  if (a === "vote") { S.vote = +el.dataset.i; save(); rerender(); return; }
  if (a === "connect") { const p = PEOPLE[el.dataset.id]; dialog(`Request to connect with ${p.first}`, `<p class="muted" style="margin-top:8px">If ${p.first} says yes, you both see each other's email.</p><form data-form="connect" data-id="${el.dataset.id}" style="margin-top:14px"><label for="note" style="font-weight:600">Add a note</label><textarea id="note" class="field" style="min-height:110px;margin-top:8px" maxlength="400" required placeholder="What you're working on and why you'd like to talk"></textarea><div class="acts"><button class="btn primary">${ic("send", 16, 2.6)} Send request</button><button type="button" class="btn" data-act="close">Cancel</button></div></form>`); return; }
  if (a === "dashOpen") { openDash(); return; }
  if (a === "dashTab") { ui.dashTab = +el.dataset.i; refreshDash(); return; }
  if (a === "dashStage") { ui.dashStage = ui.dashStage === el.dataset.v ? null : el.dataset.v; refreshDash(); return; }
  if (a === "bstep") { S.walk.build = +el.dataset.i; save(); rerender(); if (el.dataset.scroll) scrollToEl(document.getElementById("build"), true); return; }
  if (a === "afView") { ui.afView = el.dataset.v; rerender(); return; }
  if (a === "afSite") { const s = ui.afSites || (ui.afSites = new Set(["A", "B", "C"])); s.has(el.dataset.v) ? s.delete(el.dataset.v) : s.add(el.dataset.v); rerender(); return; }
  if (a === "shareDemo") { dialog("Share a demo", shareDemoForm()); return; }
  // quick tip
  if (a === "tip") { ui.tip = !ui.tip; rerender(); return; }
  if (a === "tipnext") { ui.tipI = (ui.tipI || 0) + 1; ui.tip = true; rerender(); return; }
  // shared space
  if (a === "chatopen") { openChat(ui.chat ? ui.chan : pageChan()); return; }
  if (a === "openChat") { openChat(el.dataset.ch); return; }
  if (a === "chatclose") { ui.chat = null; ui.creply = null; rerender(); const f = document.querySelector(".chat-fab"); if (f) f.focus({ preventScroll: true }); return; }
  if (a === "chatsize") { ui.chat = ui.chat === "full" ? "side" : "full"; ui.chatBottom = true; rerender(); return; }
  if (a === "chan") { ui.chan = el.dataset.ch; ui.creply = null; ui.chatBottom = true; rerender(); return; }
  if (a === "crx") { const k = el.dataset.id + ":" + el.dataset.k; S.reacts[k] = !S.reacts[k]; ui.rxPick = null; save(); rerender(); return; }
  if (a === "rxpick") { const k = el.dataset.w + "|" + el.dataset.id; ui.rxPick = ui.rxPick === k ? null : k; rerender(); return; }
  if (a === "creply") { const k = el.dataset.w + "|" + el.dataset.id; ui.creply = ui.creply === k ? null : k; rerender(); if (ui.creply) { const i = document.getElementById("cr-" + el.dataset.w + "-" + safeId(el.dataset.id)); if (i) i.focus({ preventScroll: true }); } return; }
  if (a === "addlink") { const w = el.dataset.w; ui.addLink = ui.addLink === w ? null : w; rerender(); const i = document.getElementById((ui.addLink ? "chaturl-" : "chatin-") + w); if (i) i.focus({ preventScroll: true }); return; }
  // comments and session preview

  if (a === "sview") { ui.sview = el.dataset.v; rerender(); return; }
  if (a === "hday") { ui.hday = +el.dataset.i; rerender(); return; }
  // walkthrough player
  if (a === "wstep") { const id = el.dataset.id, i = +el.dataset.i; S.walk[id] = i; if (i === 0) delete S.wdone[id]; save(); rerender(); return; }
  if (a === "wdone") { S.wdone[el.dataset.id] = true; save(); rerender(); return; }
  // demo player
  if (a === "gplay") { const g = ui.gif; if (!g) return; const D = DEMOS[g.id]; const atEnd = g.c === D.chapters.length - 1 && g.f === D.chapters[g.c].frames.length - 1; if (!g.playing && atEnd) { g.c = 0; g.f = 0; } g.playing = !g.playing; gifRender(); return; }
  if (a === "gstep") { if (ui.gif) { ui.gif.playing = false; gifStep(+el.dataset.d); } return; }
  if (a === "gchap") { if (ui.gif) { ui.gif.c = +el.dataset.i; ui.gif.f = 0; gifRender(); } return; }
  // filters and toggles
  const tog = (set, v) => { set.has(v) ? set.delete(v) : set.add(v); rerender(); };
  if (a === "role") { const v = el.dataset.v; S.roles = S.roles.includes(v) ? S.roles.filter((r) => r !== v) : S.roles.concat(v); save(); rerender(); return; }
  if (a === "libFmt") return tog(ui.libFmts, el.dataset.v);
  if (a === "libRole") return tog(ui.libRoles, el.dataset.v);
  if (a === "libClear") { ui.libFmts.clear(); ui.libRoles.clear(); ui.libQ = ""; rerender(); const s = document.getElementById("libq"); if (s) s.focus(); return; }
  if (dirty) rerender();
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.act === "check") { S.checks[el.dataset.key] = el.checked; save(); rerender(); }
  if (el.id === "dashcm") { ui.dashCm = el.value; refreshDash(); const s = document.getElementById("dashcm"); if (s) s.focus(); }
  if (el.id === "chansel") { ui.chan = el.value; ui.chatBottom = true; rerender(); const s = document.getElementById("chansel"); if (s) s.focus(); }
});
document.addEventListener("input", (e) => { const el = e.target; if (el.dataset && el.dataset.act === "libq") { ui.libQ = el.value; const pos = el.selectionStart; rerender(); const n = document.getElementById("libq"); n.focus(); n.setSelectionRange(pos, pos); } });
function trap(e, root) {
  const f = [...root.querySelectorAll("button, a[href], input, textarea, select")].filter((x) => !x.disabled && x.offsetParent !== null); if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (ui.rxPick) { ui.rxPick = null; rerender(); return; }
    if (ui.tip) { ui.tip = false; rerender(); const b = document.querySelector('[data-act="tip"]'); if (b) b.focus(); return; }
    if (layer.innerHTML) { closeDialog(); return; }
    if (ui.chat) { ui.chat = null; rerender(); const f = document.querySelector(".chat-fab"); if (f) f.focus(); return; }
    if (tour) { tourEnd(); return; }
  }
  const t = e.target;
  if (t.getAttribute && t.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) {
    const tabs = [...t.parentElement.querySelectorAll('[role="tab"]')]; const i = tabs.indexOf(t);
    const nx = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length]; e.preventDefault(); nx.click();
    const again = document.getElementById(nx.id); if (again) again.focus();
  }
  if (e.key === "Tab" && layer.innerHTML) trap(e, layer);
  else if (e.key === "Tab" && ui.chat === "full") trap(e, document.querySelector(".chatwrap.full"));
});
document.addEventListener("submit", (e) => {
  const f = e.target; e.preventDefault();
  const kind = f.dataset.form;
  if (kind === "chat") {
    const t = f.querySelector('[name="t"]').value.trim(), uEl = f.querySelector('[name="u"]'), u = uEl ? uEl.value.trim() : "";
    if (!t && !u) return;
    if (u && !/^https:\/\/[^\s]+$/i.test(u)) { uEl.setCustomValidity("Use a link that starts with https://"); uEl.reportValidity(); uEl.setCustomValidity(""); return; }
    sendChat(f.dataset.ch, t || u, u || null); return;
  }
  if (kind === "creply") { const inp = f.querySelector("input"); const t = inp.value.trim(); if (!t) return; const id = f.dataset.id, r = { who: "dana", text: t, when: "Just now" }; (S.cr[id] = S.cr[id] || []).push(r); ui.creply = null; save(); r.fresh = true; rerender(); delete r.fresh; return; }
  if (kind === "comment") { const ta = f.querySelector("textarea"); const t = ta.value.trim(); if (!t) return; const key = f.dataset.key; const c = { id: "u" + Date.now(), who: "dana", when: "Just now", text: t }; if (f.dataset.parent) c.parent = f.dataset.parent; (S.comments[key] = S.comments[key] || []).push(c); ui.replyTo = null; save(); c.fresh = true; rerender(); delete c.fresh; return; }
  if (kind === "note") { const inp = f.querySelector("input"); const t = inp.value.trim(); if (!t) return; const id = f.dataset.id; (S.notes[id] = S.notes[id] || []).push({ who: "dana", text: t }); save(); rerender(); const n = document.getElementById("ni-" + id); if (n) n.focus({ preventScroll: true }); return; }
  if (kind === "connect") { const id = f.dataset.id; S.connects[id] = "sent"; save(); closeDialog(); rerender(); toast(`${ic("check", 17, 3)} Request sent to ${PEOPLE[id].first}`); if (id === "marcus") setTimeout(() => { S.connects.marcus = "connected"; save(); rerender(); toast(`${ic("mail", 17)} Marcus accepted. You can now see each other's email.`); }, 3500); return; }
  if (kind === "sharedemo") {
    const v = (id) => f.querySelector(id).value.trim(), sn = v("#sd-s");
    const d = { id: "my" + Date.now(), mine: true, type: "Demo", by: "dana", title: v("#sd-t"), blurb: v("#sd-b"), prompt: v("#sd-p"), check: v("#sd-c"), s: sn ? +sn : null, size: "Prompt", roles: [], tools: [...f.querySelectorAll('[name="tool"]:checked')].map((x) => x.value) };
    S.mydemos = [d].concat(S.mydemos || []); save(); closeDialog(); location.hash = "lib-" + d.id; toast(`${ic("check", 17, 3)} Demo published`); return;
  }
});

route();
{ const { anchor } = parseHash(currentView()); const t = anchor && document.getElementById(anchor); if (t) scrollToEl(t, false); }

if (!seen) tourStart();
