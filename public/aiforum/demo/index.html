<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Virtual Academy Sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
:root{
  --bg:#ffffff;--surface:#f6f5f2;--surface-2:#edeae4;--ink:#1d2a31;--muted:#56636c;--line:#e3dfd8;--line-2:#d2ccc2;
  --accent:#1b6488;--accent-strong:#124b67;--accent-ink:#ffffff;--accent-soft:#e4eff5;
  --green:#2d7550;--green-soft:#e3f1e8;--brown:#87562a;--brown-soft:#f4eadf;
  --shadow:0 1px 2px rgba(29,52,65,.07),0 8px 24px rgba(29,52,65,.08);
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Libre Franklin",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181b;--surface:#1a2226;--surface-2:#222c31;--ink:#e6ebee;--muted:#a2aeb6;--line:#2c373d;--line-2:#3a474e;
  --accent:#6db3d3;--accent-strong:#94c9e2;--accent-ink:#0b1a21;--accent-soft:#17303c;
  --green:#7cc49c;--green-soft:#163024;--brown:#d7a878;--brown-soft:#33281c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b;--surface:#1a2226;--surface-2:#222c31;--ink:#e6ebee;--muted:#a2aeb6;--line:#2c373d;--line-2:#3a474e;
  --accent:#6db3d3;--accent-strong:#94c9e2;--accent-ink:#0b1a21;--accent-soft:#17303c;
  --green:#7cc49c;--green-soft:#163024;--brown:#d7a878;--brown-soft:#33281c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--accent-strong)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:var(--bg)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
h1,.display{font-family:var(--display);font-weight:600;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.c-acc{color:var(--accent)}.c-green{color:var(--green)}.c-brown{color:var(--brown)}.c-muted{color:var(--muted)}
svg.i{flex:none;display:block}

.sample{background:var(--ink);color:var(--bg);font-size:13.5px;text-align:center;padding:7px 16px}
.sample b{font-weight:600}

header.top{background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1240px;margin:0 auto;padding:16px 24px 0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--display);font-weight:600;font-size:24px;text-decoration:none;color:var(--ink);line-height:1.2}
.dates{font-size:13.5px;color:var(--muted);font-weight:500;margin-top:2px}
.top-r{display:flex;align-items:center;gap:12px;flex:none}
.me{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px}
.tour-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--accent-strong)}
.tour-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
nav.main{display:flex;gap:24px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;padding:6px 0 11px;white-space:nowrap;border-bottom:3px solid transparent;display:flex;align-items:center;gap:7px}
nav.main a:hover{color:var(--ink)}
nav.main a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 7px}

main{max-width:1240px;margin:0 auto;padding:30px 24px 120px}
.av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;letter-spacing:.02em}
.av.b{background:var(--accent-soft);color:var(--accent-strong)}.av.g{background:var(--green-soft);color:var(--green)}.av.n{background:var(--brown-soft);color:var(--brown)}.av.f{background:var(--ink);color:var(--bg)}
.av.sm{width:30px;height:30px;font-size:11.5px}.av.lg{width:52px;height:52px;font-size:17px}
.k{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.muted{color:var(--muted)}
h1.page{font-size:clamp(28px,3.4vw,36px)}
.lede{font-size:17px;color:var(--muted);max-width:66ch;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);text-decoration:none;min-height:40px;transition:background .15s,border-color .15s,transform .08s}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent-strong)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent-strong);padding-inline:10px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.small{padding:6px 12px;font-size:13.5px;min-height:34px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.copied{background:var(--green)!important;border-color:var(--green)!important;color:var(--bg)!important}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:6px 13px;font-size:14px;font-weight:500;color:var(--ink);min-height:34px}
.chip:hover{border-color:var(--accent)}
.chip .ck{display:none}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);font-weight:600}
.chip[aria-pressed="true"] .ck{display:block}
.row{display:flex;align-items:center;gap:12px}
.grid{display:grid;gap:18px}
.hint{font-size:13.5px;color:var(--muted)}

/* home */
.home-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:32px;margin-top:26px}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.day h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.sess{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;position:relative;background:var(--bg);transition:border-color .15s,box-shadow .15s,transform .15s}
.sess:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.sess .t{font-weight:600;font-size:15px;line-height:1.3;margin-top:3px;padding-right:34px}
.sess .m{font-size:12.5px;color:var(--muted);font-weight:600}
.sess.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sess .ic{position:absolute;right:11px;top:11px;width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center}
.sess .pill{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.pill.nx{background:var(--accent);color:var(--accent-ink)}
.pill.fl{background:var(--green-soft);color:var(--green)}
.break{font-size:12.5px;color:var(--muted);padding:0 4px 10px;display:flex;align-items:center;gap:6px}
.next-card{padding:22px}
.next-card h2{font-family:var(--display);font-size:24px;font-weight:600;margin:8px 0 4px;line-height:1.2}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.ib{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-strong);display:grid;place-items:center;flex:none}
.ib.g{background:var(--green-soft);color:var(--green)}.ib.n{background:var(--brown-soft);color:var(--brown)}
.lk{color:var(--ink);text-decoration:none;font-weight:600}
.lk:hover{color:var(--accent-strong);text-decoration:underline}

/* session page */
.crumbs{font-size:14px;color:var(--muted)}
.crumbs a{color:var(--muted)}
.s-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.s-head h1{font-size:clamp(28px,3.4vw,36px);max-width:26ch}
.s-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:30px;margin-top:24px;align-items:start}
.s-nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 4px}
.s-nav button{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.s-nav button:hover{border-color:var(--accent);color:var(--accent-strong)}
section.part{margin-top:30px;scroll-margin-top:20px}
.part-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.part-h h2{font-size:21px;font-weight:700;display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.start{border:2px solid var(--accent);border-radius:16px;padding:22px;background:var(--bg);box-shadow:var(--shadow)}
.start-tag{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;letter-spacing:.08em}
.start h2{font-family:var(--display);font-size:24px;font-weight:600;margin-top:12px}
.prompt{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:15px 17px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.prompt.plain{background:var(--surface)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:14px}
.tools a{font-weight:600;text-decoration:none;border:1px solid var(--line-2);border-radius:999px;padding:4px 11px;color:var(--ink)}
.tools a:hover{border-color:var(--accent);color:var(--accent-strong)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:14.5px;background:var(--surface);line-height:1.55}
.box h4{margin:0 0 8px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box.pre{white-space:pre-wrap}
.spot{display:grid;gap:6px}
.spot .sh{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.spot .sh:first-child{margin-top:0}
.ln{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 10px;font-size:14px;display:flex;gap:8px;align-items:flex-start;line-height:1.45;transition:border-color .15s,background .15s}
.ln:hover{border-color:var(--accent)}
.ln .mk{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-top:1px;display:grid;place-items:center}
.ln[aria-pressed="true"]{border-color:var(--brown);background:var(--brown-soft)}
.ln[aria-pressed="true"] .mk{border-color:var(--brown);background:var(--brown);color:var(--bg)}
.ln.hit{border-color:var(--green);background:var(--green-soft)}
.ln.hit .mk{border-color:var(--green);background:var(--green);color:var(--bg)}
.ln.miss{border-color:var(--brown);border-style:dashed}
.ln.ok-wrong{opacity:.7}
.ln .why{display:block;font-size:13px;color:var(--ink);margin-top:3px;font-weight:600}
.spot-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.verdict{border-left:3px solid var(--green);background:var(--green-soft);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14.5px;margin-top:12px}
details.reveal{margin-top:14px}
details.reveal summary{cursor:pointer;font-weight:600;color:var(--accent-strong)}
.obj{margin:10px 0 0;padding-left:20px}
.obj li{margin:4px 0}
.walk{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px;align-content:start}
.steps button{width:100%;text-align:left;border:1px solid var(--line-2);background:var(--bg);border-radius:11px;padding:9px 11px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px}
.steps button .n{width:26px;height:26px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;flex:none}
.steps button.done .n{background:var(--green);color:var(--bg)}
.steps button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.steps button.on .n{background:var(--accent);color:var(--accent-ink)}
.screen{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--surface)}
.screen .bar{height:32px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px}
.screen .bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:block}
.screen .body{padding:16px;min-height:210px;display:grid;gap:10px;align-content:start}
.mock{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;white-space:pre-wrap;max-width:88%}
.mock.me{background:var(--accent-soft);border-color:transparent;justify-self:end}
.mock.hl{box-shadow:0 0 0 2px var(--accent)}
.mock.flag{box-shadow:0 0 0 2px var(--brown)}
.step-copy{margin-top:12px;font-size:15px}
.step-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:9px 11px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;font-size:14.5px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabpanel{padding:16px 2px 2px}
table.data{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.data th,table.data td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.data th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface);font-weight:700}
table.data tr.missed td{background:var(--brown-soft)}
table.data tr.missed td:first-child{box-shadow:inset 3px 0 0 var(--brown)}
.scroll{overflow-x:auto}
.review{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.review li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.article{font-family:var(--display);font-size:18px;line-height:1.7;max-width:64ch}
.article p{margin:0 0 16px}
.hl{font:inherit;color:inherit;text-align:left;border:0;padding:0 2px;background:linear-gradient(transparent 60%,var(--green-soft) 60%);border-bottom:2px solid var(--green);border-radius:2px;cursor:pointer;display:inline;line-height:inherit}
.hl:hover,.hl[aria-expanded="true"]{background:var(--green-soft)}
.hl sup{font-family:var(--body);font-size:11px;font-weight:700;color:var(--green);margin-left:3px}
.mnote{font-family:var(--body);font-size:15px;line-height:1.5;border-left:3px solid var(--green);background:var(--surface);border-radius:0 12px 12px 0;padding:12px 14px;display:grid;gap:10px;margin:-4px 0 18px}
.mnote-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.mnote ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mnote li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;font-size:14.5px}
.mnote form{display:flex;gap:8px}
.mnote input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:999px;padding:7px 14px}
.mnote input:focus{outline:none;border-color:var(--accent)}
.comments{margin-top:16px;display:grid;gap:16px}
.comment{display:flex;gap:12px}
.comment .who{font-size:13.5px;font-weight:700}
.comment .who span{font-weight:500;color:var(--muted)}
.comment .txt{margin-top:2px;font-size:15px}
.comment.reply{margin-left:44px}
.reacts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.react{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:2px 9px;font-size:13px;font-weight:600;display:inline-flex;gap:5px;align-items:center;color:var(--muted);min-height:28px}
.react:hover{border-color:var(--accent)}
.react[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.composer{display:flex;gap:10px;align-items:flex-start;margin-top:16px}
.composer textarea{flex:1;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;min-height:46px;resize:vertical;font-size:15px}
.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.res{list-style:none;margin:0;padding:0}
.res li{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.res li:first-child{border-top:0}
.res .grow{flex:1;min-width:0}
.check{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.check input{width:20px;height:20px;accent-color:var(--green);margin-top:2px;flex:none}
.check label{font-size:15px}
.chatbox{position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.ch-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.chatbox .msgs{padding:14px 16px;overflow-y:auto;display:grid;gap:14px;min-height:240px;align-content:start}
.msg{display:flex;gap:10px}
.msg .bub{background:var(--surface);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:14.5px;margin-top:3px;overflow-wrap:anywhere}
.msg.mine .bub{background:var(--accent-soft)}
.msg .who{font-size:12.5px;font-weight:700;color:var(--muted)}
.msg.in{animation:slidein .35s ease both}
@keyframes slidein{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.fac{background:var(--ink);color:var(--bg);font-size:10px;letter-spacing:.06em;padding:1px 6px;border-radius:999px;margin-left:4px;vertical-align:1px}
.daymark{text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.typing{font-size:13px;color:var(--muted);font-style:italic}
.chatform{border-top:1px solid var(--line);padding:12px;display:flex;gap:8px}
.chatform input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font-size:15px}
.chatform input:focus{outline:none;border-color:var(--accent)}
.poll{margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg);max-width:420px}
.poll-q{font-weight:600;font-size:14.5px}
.popt{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;background:var(--bg);overflow:hidden;text-align:left;font-size:14px}
.popt:hover{border-color:var(--accent)}
.popt .fill{position:absolute;inset:0 auto 0 0;background:var(--accent-soft);z-index:0;transition:width .6s ease}
.popt span{position:relative;z-index:1}
.popt b{position:relative;z-index:1;font-variant-numeric:tabular-nums;font-size:13px}
.popt[aria-pressed="true"]{border-color:var(--accent);font-weight:600}
.outline-note{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:12px 16px;font-size:14.5px;margin-top:18px;display:flex;gap:10px;align-items:flex-start}
.checkline{margin-top:16px;border-left:3px solid var(--brown);background:var(--brown-soft);border-radius:0 12px 12px 0;padding:12px 16px;font-size:15px}
.checkline b{display:block;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--brown);margin-bottom:2px}
.lab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.post{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.post h4{margin:8px 0 4px;font-size:16px}
.post dl{margin:4px 0 0;font-size:14.5px}
.post dt{font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.post dt.w{color:var(--green)}.post dt.d{color:var(--brown)}
.post dd{margin:2px 0 0}
.post.new{animation:slidein .5s ease both;border-color:var(--accent)}

.tbl-h{font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.tbl-h:first-child{margin-top:0}
/* library, people, chat */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.filters .lbl{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);min-width:56px}
.search{border:1px solid var(--line-2);border-radius:999px;padding:9px 16px;min-width:280px;font-size:15px}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
table.lib td:first-child{width:44px}
table.lib .ib{width:32px;height:32px;border-radius:8px}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}
.person{padding:18px;display:grid;gap:12px;align-content:start}
.person .pj{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14.5px}
.chat-page{display:grid;grid-template-columns:260px minmax(0,1fr);margin-top:22px;min-height:560px;overflow:hidden}
.channels{border-right:1px solid var(--line);padding:12px;display:grid;gap:2px;align-content:start;background:var(--surface)}
.channels button{text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;font-weight:500;color:var(--muted);font-size:14px}
.channels button:hover{background:var(--surface-2);color:var(--ink)}
.channels button[aria-current="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.chat-main{display:flex;flex-direction:column;min-width:0}
.chat-main .msgs{padding:18px 20px;display:grid;gap:14px;align-content:start;flex:1;overflow-y:auto;max-height:560px}

/* dialog, toast */
.scrim{position:fixed;inset:0;background:rgba(17,28,34,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:var(--bg);border-radius:18px;max-width:560px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.25);max-height:calc(100vh - 32px);overflow-y:auto}
.dialog h2{font-family:var(--display);font-size:23px;font-weight:600}
.dialog .acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.field{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:11px 13px;font-size:16px}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:999px;padding:11px 18px;font-weight:500;font-size:14.5px;z-index:60;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* tour */
.tour{position:fixed;right:20px;bottom:20px;z-index:45;width:min(370px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 18px 50px rgba(17,28,34,.24);padding:18px;display:grid;gap:10px;animation:rise .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
.tour-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:32px}
.tour-dots{display:flex;gap:4px;flex-wrap:wrap}
.tour-dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2);transition:background .3s,width .3s}
.tour-dots i.on{background:var(--accent);width:18px;border-radius:4px}
.tour-dots i.past{background:var(--accent-soft)}
.tour .k{color:var(--green)}
.tour h2{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.25}
.tour p{color:var(--muted);font-size:14.5px}
.tour{max-height:min(78vh,600px);overflow:auto}
.tour-why{display:grid;gap:2px;font-size:14px;line-height:1.45;border-left:3px solid var(--accent-soft);padding-left:10px}
.tour-why b{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--green)}
.tour-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.ibtn{width:34px;height:34px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center}
.ibtn:hover{background:var(--surface-2);color:var(--ink)}
.tour-ring{outline:2px solid var(--accent)!important;outline-offset:5px;border-radius:14px;animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 40%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--accent) 0%,transparent)}}

@media (max-width:980px){
  .home-grid,.s-layout{grid-template-columns:1fr}
  .chatbox{position:static;max-height:none}
  .chatbox .msgs{max-height:420px}
  .people{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:680px){
  .days,.people,.lab,.compare,.walk{grid-template-columns:1fr}
  .steps{grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;padding-bottom:4px}
  .chat-page{grid-template-columns:1fr}
  .channels{border-right:0;border-bottom:1px solid var(--line);grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}
  main{padding:22px 16px 230px}
  .top-inner{padding:12px 16px 0}
  .brand{font-size:20px}
  .dates{font-size:12.5px}
  .me span{display:none}
  .tour-btn span{display:none}
  .tour-btn{padding:8px}
  .search{min-width:0;width:100%}
  .start{padding:16px}
  .article{font-size:17px}
  .tour{right:12px;left:12px;bottom:12px;width:auto;padding:16px}
  .toast{bottom:16px}
  input,textarea{font-size:16px!important}
  .sched{grid-template-columns:1fr!important}
  .sched .acts{justify-content:flex-start!important}
}
/* ===== integrated build additions ===== */
nav.main a .badge{margin-left:2px}
.bnav{display:none}
.wrap{max-width:1240px;margin:0 auto}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:34px 0 14px;flex-wrap:wrap}
.sec-h h2{font-family:var(--display);font-size:23px;font-weight:600;display:flex;align-items:center;gap:10px}
.sec-h a{font-size:14px}
.hello{font-size:15px;color:var(--muted);font-weight:500}
.hello b{color:var(--ink)}

/* home: next session + countdown */
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-top:16px}
.next{padding:24px;position:relative;overflow:hidden;border-color:var(--line-2)}
.next::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--accent-soft);opacity:.7;pointer-events:none}
.next>*{position:relative;z-index:1}
.next h2{font-family:var(--display);font-size:clamp(22px,2.4vw,27px);font-weight:600;line-height:1.2;margin:10px 0 4px;max-width:30ch}
.count{display:flex;gap:10px;margin:18px 0 18px;flex-wrap:wrap}
.count div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:74px;text-align:center}
.count b{display:block;font-family:var(--display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--accent-strong)}
.count span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.tip{padding:22px;display:grid;gap:10px;align-content:start;background:var(--brown-soft);border-color:transparent}
.tip .k{color:var(--brown)}
.tip p{font-size:17px;font-family:var(--display);line-height:1.45}
.tip .tip-ill{display:flex;gap:8px;align-items:center;margin-top:4px}
.tip .shot{width:84px;height:56px;border-radius:8px;background:var(--bg);border:1px solid var(--line-2);position:relative;overflow:hidden}
.tip .shot i{position:absolute;left:8px;right:8px;height:6px;border-radius:3px;background:var(--surface-2)}
.tip .shot i:nth-child(1){top:9px;right:30px}.tip .shot i:nth-child(2){top:21px}.tip .shot i:nth-child(3){top:33px;right:20px}
.tip .shot .blur{position:absolute;left:8px;top:44px;width:40px;height:7px;border-radius:3px;background:var(--brown);opacity:.8}

/* path */
.pathbox{padding:20px 22px}
.path-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.track-wrap{overflow-x:auto;margin:6px -6px 0;padding:0 6px}
.track{display:grid;grid-template-columns:repeat(8,minmax(64px,1fr));position:relative;margin:18px 0 4px;min-width:560px}
.track .line{position:absolute;left:calc(100%/16);right:calc(100%/16);top:19px;height:3px;background:var(--line-2);border-radius:3px}
.track .line i{position:absolute;left:0;top:0;bottom:0;background:var(--green);border-radius:3px}
.node{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--ink);position:relative;z-index:1;text-align:center;padding:0 2px}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line-2);color:var(--muted);font-weight:700;font-size:14px;transition:transform .15s}
.node:hover .dot{transform:scale(1.08)}
.node .nl{font-size:12.5px;font-weight:600;line-height:1.25}
.node .nt{font-size:11.5px;color:var(--muted)}
.node.done .dot{background:var(--green);border-color:var(--green);color:var(--bg)}
.node.next .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.node.mine .dot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--brown)}
.node.next.mine .dot{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--brown),0 0 0 9px var(--accent-soft)}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:12px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:12px;height:12px;border-radius:50%;display:inline-block;border:2px solid var(--line-2);background:var(--bg)}
.key i.d{background:var(--green);border-color:var(--green)}.key i.n{background:var(--accent);border-color:var(--accent)}.key i.m{border-color:var(--brown)}

/* featured */
.feature{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);overflow:hidden}
.feature .f-vis{background:var(--green-soft);padding:22px;display:grid;place-items:center;min-height:260px;position:relative}
.feature .f-txt{padding:24px;display:grid;gap:12px;align-content:start}
.feature h3{font-family:var(--display);font-size:25px;font-weight:600;line-height:1.2}
.f-steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.f-steps li{display:flex;gap:10px;align-items:center;font-size:14.5px}
.f-steps li b{width:22px;height:22px;border-radius:50%;background:var(--green);color:var(--bg);font-size:11.5px;display:grid;place-items:center;flex:none}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}

/* mini wireframe used in feature + thumbnails */
.mini{width:100%;max-width:380px;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.mini .mb{height:22px;border-bottom:1px solid var(--line);display:flex;gap:5px;align-items:center;padding:0 9px}
.mini .mb i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.mini .mc{padding:12px;display:grid;gap:8px}
.mrow{display:flex;gap:8px;align-items:center}
.mbar{height:8px;border-radius:4px;background:var(--surface-2)}
.mpill{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;background:var(--accent-soft);color:var(--accent-strong);white-space:nowrap}
.mpill.g{background:var(--green-soft);color:var(--green)}.mpill.n{background:var(--brown-soft);color:var(--brown)}
.mcur{position:absolute;width:18px;height:18px;color:var(--ink);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25));animation:mcur 6s ease-in-out infinite;left:20%;top:70%}
.mcur svg{display:block}
@keyframes mcur{0%,8%{left:18%;top:72%}28%,40%{left:62%;top:38%}60%,72%{left:76%;top:76%}92%,100%{left:18%;top:72%}}
.mclick{position:absolute;width:30px;height:30px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:mclick 6s ease-out infinite;left:62%;top:38%}
@keyframes mclick{0%,30%{opacity:0;transform:scale(.4)}34%{opacity:.9}44%{opacity:0;transform:scale(1.4)}100%{opacity:0}}

/* library cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);transition:border-color .15s,box-shadow .15s,transform .15s}
.card:hover,.card:focus-visible{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-2px)}
.card .cb{padding:14px 16px 16px;display:grid;gap:6px;align-content:start;flex:1}
.card h3{font-size:16.5px;line-height:1.3;font-weight:650}
.card .blurb{font-size:14px;color:var(--muted);line-height:1.45}
.card .meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.fmt{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.fmt.Article{color:var(--brown)}.fmt.Walkthrough{color:var(--green)}.fmt.Demo{color:var(--accent-strong)}
.th{height:128px;position:relative;overflow:hidden;display:grid;place-items:center}
.th.Article{background:var(--brown-soft)}.th.Walkthrough{background:var(--green-soft)}.th.Demo{background:var(--accent-soft)}
.th .page{width:58%;background:var(--bg);border-radius:8px 8px 0 0;align-self:end;height:100px;padding:12px;display:grid;gap:6px;align-content:start;box-shadow:var(--shadow)}
.th .page .ttl{height:9px;border-radius:4px;background:var(--ink);width:70%;opacity:.8}
.th .page .ln2{height:6px;border-radius:3px;background:var(--surface-2)}
.th .page .ln2.u{background:var(--green-soft);border-bottom:2px solid var(--green);height:7px}
.th .mini{width:72%;max-width:220px}
.th .mini .mc{padding:9px;gap:6px}
.card .mcur,.card .mclick,.card .ga,.card .bar-g i{animation-play-state:paused}
.card:hover .mcur,.card:hover .mclick,.card:hover .ga,.card:hover .bar-g i,.card:focus-visible .mcur,.card:focus-visible .mclick{animation-play-state:running}
.playc{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);right:14px;bottom:12px}
.bar-g{display:flex;gap:5px;align-items:flex-end;height:34px}
.bar-g i{width:10px;border-radius:3px 3px 0 0;background:var(--accent);animation:barg 2.4s ease-in-out infinite;transform-origin:bottom}
.bar-g i:nth-child(2){animation-delay:.2s;background:var(--green)}.bar-g i:nth-child(3){animation-delay:.4s}.bar-g i:nth-child(4){animation-delay:.6s;background:var(--brown)}
@keyframes barg{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.in-s{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:6px;padding:2px 7px}
.chip .ci{display:inline-flex}
.chip[aria-pressed="true"] .ci{display:none}
.chip.f-Article .ci{color:var(--brown)}.chip.f-Walkthrough .ci{color:var(--green)}.chip.f-Demo .ci{color:var(--accent-strong)}

/* reader */
.r-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:34px;margin-top:22px;align-items:start}
.r-side{display:grid;gap:16px;position:sticky;top:16px}
.r-side .panel{padding:16px 18px}
.r-side h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rel{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rel a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;color:var(--ink);font-weight:600;font-size:14.5px;line-height:1.35}
.rel a:hover{color:var(--accent-strong)}
.rel .ib{width:32px;height:32px;border-radius:8px}
.r-head{display:grid;gap:10px;margin-top:10px}
.r-head h1{font-size:clamp(28px,3.4vw,38px);max-width:24ch;line-height:1.15}
.byline{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);font-weight:600}

/* walkthrough player */
.wk{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;margin-top:20px}
.stage{position:relative;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--surface);min-height:330px}
.stage .sbar{height:34px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px}
.stage .sbar i{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:block}
.stage .sbar .url{margin-left:10px;flex:1;max-width:320px;height:20px;border-radius:6px;background:var(--surface);font-size:11.5px;color:var(--muted);display:flex;align-items:center;padding:0 9px;overflow:hidden;white-space:nowrap}
.scr{padding:18px;display:grid;gap:12px;align-content:start}
.scr .ga{animation:gin .45s ease both;animation-delay:var(--d,0s)}
.cur{position:absolute;left:30px;top:60px;width:22px;height:22px;z-index:4;pointer-events:none;color:var(--ink);transition:left .9s cubic-bezier(.55,0,.2,1),top .9s cubic-bezier(.55,0,.2,1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.cur svg{display:block}
.tgt{position:relative;transition:box-shadow .3s}
.tgt.lit{box-shadow:0 0 0 3px var(--accent);border-radius:8px}
.ping{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:2px solid var(--accent);z-index:3;pointer-events:none;animation:ping 1.5s ease-out infinite}
@keyframes ping{0%{transform:scale(.3);opacity:1}100%{transform:scale(1.25);opacity:0}}
.wk-cap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.wk-num{font-family:var(--display);font-size:46px;line-height:.9;color:var(--accent);font-weight:600}
.wk-cap h3{font-size:19px;margin-bottom:4px}
.wk-cap p{font-size:15.5px}
.segs{display:flex;gap:4px;margin-top:14px}
.segs button{flex:1;height:6px;border-radius:3px;background:var(--line-2);border:0;padding:0}
.segs button.past{background:var(--green)}.segs button.on{background:var(--accent)}
.flagline{margin-top:12px;border-left:3px solid var(--brown);background:var(--brown-soft);border-radius:0 10px 10px 0;padding:9px 13px;font-size:14.5px;display:flex;gap:9px;align-items:flex-start}
.flagline .c-brown{margin-top:2px}
.done-card{border:1px solid var(--green);background:var(--green-soft);border-radius:12px;padding:14px 16px;margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* wireframe pieces */
.wf{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45}
.wf h5{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wf-in{border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;background:var(--bg);font-size:13.5px;min-height:34px}
.wf-btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:6px 11px;background:var(--accent);color:var(--accent-ink);font-size:12.5px;font-weight:700;white-space:nowrap}
.wf-btn.alt{background:var(--surface-2);color:var(--ink)}
.wf-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;background:var(--bg)}
.wf-chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.wf-chip.g{background:var(--green-soft);border-color:transparent;color:var(--green)}
.wf-chip.n{background:var(--brown-soft);border-color:transparent;color:var(--brown)}
.wf-menu{display:flex;gap:14px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:7px}
.wf-drop{border:1px solid var(--line-2);border-radius:8px;background:var(--bg);box-shadow:var(--shadow);font-size:13px;display:grid;width:max-content;min-width:170px}
.wf-drop span{padding:6px 11px;border-top:1px solid var(--line)}
.wf-drop span:first-child{border-top:0}
.wf-drop span.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.wf-split{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wf-code{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface);border-radius:8px;padding:8px 10px;white-space:pre;overflow:hidden;color:var(--muted)}
.wf table{width:100%;border-collapse:collapse;font-size:12.5px}
.wf th,.wf td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.wf th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bubble{background:var(--surface);border-radius:4px 12px 12px 12px;padding:8px 11px;font-size:13.5px;max-width:92%;justify-self:start}
.bubble.me{background:var(--accent-soft);border-radius:12px 4px 12px 12px;justify-self:end}
.bubble.flag{box-shadow:0 0 0 2px var(--brown)}

/* gif demo player */
.gif{border:1px solid var(--line-2);border-radius:16px;overflow:hidden;background:var(--bg);margin-top:20px}
.chaps{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.chaps::-webkit-scrollbar{display:none}
.chap{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:6px 13px 6px 6px;font-size:14px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chap b{width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:12px}
.chap[aria-current="true"]{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}
.chap[aria-current="true"] b{background:var(--accent);color:var(--accent-ink)}
.chap.past b{background:var(--green);color:var(--bg)}
.g-stage{background:var(--surface);min-height:380px;padding:22px;display:grid;place-items:center;position:relative;overflow:hidden}
.g-stage>.g-inner{width:100%;max-width:640px}
.gprog{display:flex;gap:4px;padding:12px 14px 0}
.gprog i{flex:1;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden;position:relative}
.gprog i.past{background:var(--green)}
.gprog i.on b{position:absolute;inset:0;background:var(--accent);transform-origin:left;animation:gfill linear both}
@keyframes gfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.gif.paused .gprog i.on b{animation:none;transform:scaleX(1);opacity:.45}
.g-cap{display:flex;align-items:center;gap:12px;padding:12px 14px 14px}
.g-cap p{flex:1;font-size:15.5px;font-weight:500}
.g-cap .lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-strong);display:block}
.ga{animation:gin .5s ease both;animation-delay:var(--d,0s)}
@keyframes gin{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.gpop{animation:gpop .45s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d,0s)}
@keyframes gpop{from{opacity:.001;transform:scale(.7)}to{opacity:1;transform:none}}
.gwipe{animation:gwipe 1.4s ease both;animation-delay:var(--d,0s)}
@keyframes gwipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.gsel{background-image:linear-gradient(var(--accent-soft),var(--accent-soft));background-repeat:no-repeat;background-size:0 100%;animation:gsel 1.6s ease both;animation-delay:var(--d,0s)}
@keyframes gsel{to{background-size:100% 100%}}
.kw{background:var(--accent-soft);color:var(--accent-strong);border-radius:4px;padding:0 3px;font-weight:600}
.meter{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:var(--green);width:var(--to);animation:meter 1.6s cubic-bezier(.3,0,.2,1) both;animation-delay:var(--d,0s)}
@keyframes meter{from{width:var(--from)}to{width:var(--to)}}
.phone{width:250px;margin:0 auto;border:2px solid var(--line-2);border-radius:30px;background:var(--bg);padding:16px 14px 18px;box-shadow:var(--shadow);display:grid;gap:10px;justify-items:center;text-align:center}
.phone .notch{width:70px;height:6px;border-radius:3px;background:var(--line-2)}
.orb{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--accent-soft),var(--accent) 70%);animation:orb 2.4s ease-in-out infinite;margin:6px 0}
@keyframes orb{0%,100%{transform:scale(.92)}50%{transform:scale(1.05)}}
.orb.listen{background:radial-gradient(circle at 35% 30%,var(--green-soft),var(--green) 70%)}
.wave{display:flex;gap:4px;align-items:center;height:34px}
.wave i{width:5px;height:100%;border-radius:3px;background:var(--green);animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(5n){animation-delay:.45s}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.g-prompt{margin-top:14px}
.g-prompt .prompt{font-size:15px}

/* people + academy chat */
.ppl-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:26px;margin-top:22px;align-items:start}
.dir{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.pcard{padding:16px;display:grid;gap:10px;align-content:start}
.pcard .pj{font-size:14.5px;line-height:1.4}
.stage-pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px}
.stage-pill.Idea{background:var(--brown-soft);color:var(--brown)}
.stage-pill.Pilot{background:var(--accent-soft);color:var(--accent-strong)}
.stage-pill.Results{background:var(--green-soft);color:var(--green)}
.achat{position:sticky;top:16px;display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.achat .ch-head{flex-wrap:wrap}
.achat .msgs{padding:14px 16px;overflow-y:auto;display:grid;gap:14px;align-content:start;flex:1;min-height:260px}
.ttag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.ttag.Question{background:var(--accent-soft);color:var(--accent-strong)}
.ttag.Idea{background:var(--brown-soft);color:var(--brown)}
.ttag.Challenge{background:var(--surface-2);color:var(--ink)}
.ttag.Win{background:var(--green-soft);color:var(--green)}
.tagpick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 0;border-top:1px solid var(--line)}
.tagpick button{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.tagpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.achat .chatform{border-top:0}
.lib-mini{display:grid;gap:10px}
.lib-mini a{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);transition:border-color .15s}
.lib-mini a:hover{border-color:var(--accent)}
.lib-mini .ib{width:34px;height:34px;border-radius:9px}
.lib-mini b{display:block;font-size:14.5px;line-height:1.3}
.ib.Article{background:var(--brown-soft);color:var(--brown)}.ib.Walkthrough{background:var(--green-soft);color:var(--green)}.ib.Demo{background:var(--accent-soft);color:var(--accent-strong)}

@media (max-width:980px){
  .hero,.feature,.r-layout,.ppl-layout{grid-template-columns:1fr}
  .r-side,.achat{position:static;max-height:none}
  .achat .msgs{max-height:460px}
}
@media (max-width:680px){
  nav.main{display:none}
  .top-inner{padding-bottom:12px}
  .bnav{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:40;grid-template-columns:repeat(4,1fr);background:var(--bg);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;padding:4px 0;position:relative}
  .bnav a.on{color:var(--accent-strong)}
  .bnav .badge{position:absolute;top:0;left:calc(50% + 6px);font-size:10px;padding:0 5px}
  .tour{bottom:84px!important}
  .tour.up{top:12px;bottom:auto!important}
  .tour{max-height:52vh}
  .toast{bottom:88px!important}
  main{padding-bottom:260px}
  .duo,.dir,.wk,.wf-split{grid-template-columns:1fr}
  .wk .steps{grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;padding-bottom:4px}
  .count div{min-width:64px;padding:7px 9px}
  .count b{font-size:26px}
  .g-stage{padding:14px;min-height:340px}
  .scr{padding:12px}
  .stage{min-height:300px}
  .feature .f-vis{min-height:210px;padding:16px}
  .next,.tip,.feature .f-txt{padding:18px}
  .wk-num{font-size:38px}
  .cards{grid-template-columns:1fr}
}
.bubble{white-space:pre-line}
.ag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 18px}
.ag{padding:14px 16px;display:grid;gap:6px;align-content:start}
.ag .ib{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.ag b{font-size:15px}.ag p{font-size:14px;color:var(--muted);margin:0}
.settle{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.settle li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.settle li .c-green{flex:none;margin-top:2px}
@media (max-width:680px){.ag-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.gsel{background-size:100% 100%!important}}
/* ===== UI/UX scrub: one accent for what you can click, neutral everything else ===== */
.c-acc,.c-brown{color:var(--muted)}
.av.b,.av.g,.av.n{background:var(--surface-2);color:var(--ink)}
.fmt,.fmt.Article,.fmt.Walkthrough,.fmt.Demo{color:var(--muted);font-size:11.5px}
.th,.th.Article,.th.Walkthrough,.th.Demo{background:var(--surface)}
.th .page .ln2.u{background:var(--surface-2);border:0;height:6px}
.bar-g i,.bar-g i:nth-child(2),.bar-g i:nth-child(4){background:var(--line-2)}
.mpill.g{background:var(--surface-2)!important;color:var(--muted)!important}
.ib,.ib.g,.ib.n,.ag .ib{background:var(--surface);color:var(--muted)}
.start{border:0;padding:0;box-shadow:none;background:none}
.start-tag{background:none;color:var(--muted);padding:0;letter-spacing:.08em}
.prompt{background:var(--surface)}
.checkline{border-left:3px solid var(--line-2);background:none}
.checkline b{color:var(--muted)}
.mnote{border-left-color:var(--line-2)}
.mnote-h{color:var(--muted)}
.hl{background:none;border-bottom:2px solid var(--accent)}
.hl:hover,.hl[aria-expanded="true"]{background:var(--accent-soft)}
.hl sup{color:var(--accent-strong)}
.ln[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ln[aria-pressed="true"] .mk{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.ln.miss{border-color:var(--ink);border-style:dashed}
.mock.flag{box-shadow:0 0 0 2px var(--ink)}
.post dt.w,.post dt.d{color:var(--ink)}
table.data tr.missed td{background:var(--surface)}
table.data tr.missed td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.tour .k{color:var(--muted)}
.tour{left:20px;right:auto}
main.narrow{max-width:820px}
main.narrow .panel{border:0!important;padding:0!important;border-radius:0}
section.part{border-top:1px solid var(--line);padding-top:28px;margin-top:36px}
h2.sec-h{display:block;font-family:var(--display);font-size:22px;font-weight:600;margin:0 0 12px}
h2.sec-h .muted{font-family:var(--body);font-size:15px;font-weight:600}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--accent-strong);font-weight:600;font-size:13.5px;display:inline-flex;gap:5px;align-items:center}
.linkbtn:hover{text-decoration:underline}
.sample-tour{background:none;border:0;color:inherit;text-decoration:underline;font-weight:600;margin-left:6px;font-size:inherit;padding:0}

/* header */
.top-inner{display:flex;align-items:center;gap:32px;padding:0 24px}
.brand{font-size:20px;display:flex;flex-direction:column;padding:12px 0;flex:none}
.brand .dates{font-family:var(--body);font-size:12.5px;margin-top:1px}
nav.main{margin:0;flex:1;align-self:stretch;gap:26px}
nav.main a{padding:24px 0 21px}
.top-r{gap:4px}
.top-r .ibtn{position:relative;width:40px;height:40px;border-radius:50%}
.top-r .badge{position:absolute;top:3px;right:1px;font-size:10.5px;padding:0 5px;line-height:16px}
.top-r .me{margin-left:8px}
.tipwrap{position:relative}
.tippop{position:absolute;right:0;top:calc(100% + 8px);width:300px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;z-index:30;display:grid;gap:8px;justify-items:start}
.tippop p{font-size:15px}

/* home */
.hello{margin-bottom:22px}
.home-top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:40px;align-items:start}
.sec-k{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.nx{display:flex;gap:18px;align-items:flex-start}
.tile{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:56px;height:60px;border:1px solid var(--line-2);border-radius:10px;flex:none;background:var(--bg)}
.tile .tm{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brown)}
.tile .td{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.05;color:var(--ink)}
.nx-t{font-family:var(--display);font-size:clamp(22px,2.4vw,28px);font-weight:600;color:var(--ink);text-decoration:none;line-height:1.2;display:block}
.nx-t:hover{color:var(--accent-strong);text-decoration:underline}
.when{color:var(--brown);font-weight:600;font-size:15px;margin-top:6px}
.acts-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.forum{border-left:1px solid var(--line);padding-left:32px}
.feed{list-style:none;margin:0;padding:0}
.feed li+li{border-top:1px solid var(--line)}
.fl{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;text-decoration:none;color:var(--ink);font-size:14.5px;line-height:1.4;width:100%;text-align:left;border:0;background:none}
.fl{grid-template-columns:30px minmax(0,1fr)!important;padding:11px 0!important}
.fl .fq{display:block;font-size:15px;line-height:1.45}
.fl .fm{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.fl .fm b{color:var(--ink)}
.fl .ti{color:var(--accent-strong);font-weight:600}
.fl:hover .ti{text-decoration:underline}
.fw{color:var(--muted);font-size:13px;white-space:nowrap;padding-top:1px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:44px;padding-top:30px;border-top:1px solid var(--line)}
.col-hr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;min-height:32px}
.col-h{font-family:var(--display);font-size:21px;font-weight:600;display:flex;align-items:center;gap:9px}
.col-h svg{color:var(--muted)}
.trows{list-style:none;margin:10px 0 0;padding:0}
.trows a{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;line-height:1.35}
.trows a:hover{color:var(--accent-strong)}
.trows a>span:first-child{display:grid;gap:3px}
.trows .muted{font-weight:500;font-size:13px;white-space:nowrap}
.seeall{display:inline-flex;gap:6px;align-items:center;margin-top:12px;font-weight:600;font-size:14.5px;text-decoration:none;color:var(--accent-strong)}
.seeall:hover{text-decoration:underline}
.aitools{display:flex;gap:6px;flex-wrap:wrap}
.aib{font-size:12px;font-weight:600;border:1px solid var(--line-2);border-radius:999px;padding:1px 8px;color:var(--muted)}
.card .meta .in-s{font-weight:500}

/* sessions agenda */
.agenda{margin-top:28px}
.aday{padding:22px 0 10px;border-top:1px solid var(--line)}
.aday-h{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.aday-h h2{font-family:var(--display);font-size:21px;font-weight:600}
.arow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding:12px 0 12px 70px;text-decoration:none;color:var(--ink)}
.arow .at{color:var(--brown);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;padding-top:1px}
.atitle{display:block;font-weight:600;font-size:16px}
a.arow:hover .atitle{color:var(--accent-strong);text-decoration:underline}
.adesc{display:block;color:var(--muted);font-size:14.5px;margin-top:2px}
.arow.brk .atitle{color:var(--muted);font-weight:500}

/* session page */
.s-title{font-size:clamp(28px,3.4vw,38px);margin-top:10px;line-height:1.15}
.s-when{display:flex;gap:14px;align-items:center;margin-top:16px}
.s-when .when{margin-top:0}
.onpage{display:flex;gap:6px 20px;flex-wrap:wrap;margin:28px 0 0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.onpage button{border:0;background:none;padding:2px 0;color:var(--accent-strong);font-weight:600;font-size:14px}
.onpage button:hover{text-decoration:underline}
.onpage+section.part{border-top:0;margin-top:20px}
.sample-note{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:15px}
.part-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.part-row h2.sec-h{margin:0}
.seg{display:inline-flex;align-items:center;gap:4px;font-size:13px}
.seg>span{margin-right:4px}
.seg button{border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--ink)}
.seg button:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hlist{list-style:none;margin:0;padding:0}
.hlist li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.ht{color:var(--brown);font-weight:600;font-variant-numeric:tabular-nums}
.hm{color:var(--muted);font-size:13.5px}

.livedot{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-weight:700;font-size:13.5px}

.hr-live{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.rec{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.rec>svg{color:var(--accent)}
.rec b{display:block}
.rec .muted{font-size:13.5px}
.rec:hover{border-color:var(--accent)}

/* shared posts: one set, shown on the session page and in the side panel */
.msgs.plain{display:grid;gap:16px;margin-top:4px}
.cmsg{display:flex;gap:10px}
.cmsg.in{animation:slidein .35s ease both}
.mh{display:flex;gap:8px;align-items:baseline;font-size:13.5px;flex-wrap:wrap}
.mh b{font-weight:700}
.mh span{color:var(--muted);font-size:12.5px}
.mh .role{border:1px solid var(--line-2);border-radius:999px;padding:0 6px;font-size:11px;font-weight:600}
.mt{font-size:15px;margin-top:1px;overflow-wrap:anywhere}
.cmsg.sm .mt{font-size:14.5px}
.rlink{display:inline-flex;gap:8px;align-items:center;margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;text-decoration:none;color:var(--accent-strong);max-width:100%}
.rlink span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlink:hover{border-color:var(--accent)}
.mrx{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
.rx{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:1px 8px;font-size:13px;display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-weight:600;min-height:26px}
.rx:hover{border-color:var(--accent)}
.rx[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong)}
.addrx{border:0;background:none;color:var(--muted);width:28px;height:26px;display:inline-grid;place-items:center;border-radius:999px}
.addrx:hover{background:var(--surface-2);color:var(--ink)}
.popwrap{position:relative;display:inline-flex}
.emopop{position:absolute;bottom:calc(100% + 4px);left:0;display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow);padding:4px;z-index:5}
.emopop button{border:0;background:none;font-size:18px;width:34px;height:34px;border-radius:50%}
.emopop button:hover{background:var(--surface-2)}
.mrx .linkbtn{margin-left:4px}
.thread{margin-top:8px;padding-left:14px;border-left:2px solid var(--line);display:grid;gap:10px}
.rform{display:flex;gap:8px;margin-top:8px}
.rform input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:999px;padding:7px 14px;font-size:14.5px}
.daysep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;font-weight:600}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.ccomp{display:flex;gap:8px;align-items:flex-end;margin-top:16px}
.cc-in{flex:1;min-width:0;display:grid;gap:6px}
.ccomp input{width:100%;border:1px solid var(--line-2);border-radius:12px;padding:10px 14px;font-size:15px}
.ccomp input:focus,.rform input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ccomp .ibtn{width:42px;height:42px;border-radius:50%}
.ccomp .ibtn[aria-pressed="true"]{color:var(--accent-strong);background:var(--accent-soft)}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:hover{background:var(--accent-strong)}

/* side panel and full screen */
.chat-fab{position:fixed;right:22px;bottom:22px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;box-shadow:0 8px 24px rgba(17,28,34,.22);z-index:35}
.chat-fab:hover{background:var(--accent-strong)}
.chat-fab .badge{position:absolute;top:-3px;right:-3px;background:var(--bg);color:var(--accent-strong);box-shadow:0 0 0 2px var(--accent);line-height:17px}
.chatwrap.side{position:fixed;top:0;right:0;bottom:0;width:400px;background:var(--bg);border-left:1px solid var(--line);z-index:36;display:flex;box-shadow:-8px 0 30px rgba(17,28,34,.08)}
.cmain{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 12px 12px 18px;border-bottom:1px solid var(--line)}
.chead select{border:1px solid var(--line-2);border-radius:10px;padding:7px 10px;font-weight:600;font-size:14.5px;background:var(--bg);color:var(--ink);min-width:0;max-width:250px}
.chead h2{font-size:18px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chead h2 svg{color:var(--muted)}
.chat-sub{font-weight:500;font-size:14.5px}
.chead a.ibtn{color:var(--muted)}
.cmain .msgs{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:16px;align-content:start}
.cmain .ccomp{margin:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.chatwrap.full{position:fixed;inset:0;z-index:55;background:var(--bg);display:grid;grid-template-columns:260px minmax(0,1fr)}
.chatwrap.full .msgs{padding:22px 32px}
.chatwrap.full .ccomp{padding:14px 32px}
.chans{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.chans-h{padding:0 10px 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chan{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:8px;padding:8px 10px;text-align:left;font-size:14.5px;color:var(--muted)}
.chan-s{margin-left:auto;font-size:12.5px}
.chan:hover{background:var(--surface-2);color:var(--ink)}
.chan[aria-current="true"]{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
body.chat-full{overflow:hidden}
@media (min-width:1100px){body.chat-side #app{margin-right:400px}}

/* comments */
.cmts{margin-top:40px;border-top:1px solid var(--line);padding-top:22px}
.cmts-h{font-family:var(--display);font-size:22px;font-weight:600}
.cmts-h .muted{font-family:var(--body);font-size:15px;font-weight:600}
.cform{display:flex;gap:10px;align-items:flex-start;margin:16px 0 6px}
.cbox{flex:1;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;min-height:46px;resize:vertical;font-size:15px}
.cbox:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.clist,.creplies{list-style:none;margin:0;padding:0}
.cmt{display:flex;gap:12px;padding:16px 0}
.cmt.in{animation:slidein .35s ease both}
.clist>.cmt+.cmt{border-top:1px solid var(--line)}
.cbody{flex:1;min-width:0}
.chd{display:flex;gap:8px;align-items:baseline;font-size:14px;flex-wrap:wrap}
.chd .muted{font-size:13px}
.ctext{font-size:15.5px;margin-top:3px}
.cacts{display:flex;gap:16px;margin-top:6px}
.creplies{margin-top:6px;padding-left:16px;border-left:2px solid var(--line)}
.creplies .cmt{padding:12px 0 4px}
.cform.sm{margin:10px 0 0}

/* reader */
.r-head{margin-bottom:24px}
.goes{font-size:14.5px;color:var(--muted)}
.wk{grid-template-columns:220px minmax(0,1fr)}

/* library and people */
.page-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.plist{list-style:none;margin:22px 0 0;padding:0}
.drow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:start;padding:20px 0;border-top:1px solid var(--line)}
.dname{font-weight:700;font-size:16.5px}
.dwork{margin-top:6px;font-size:15px}
.dwork .muted{margin-right:4px}
.dact{display:grid;gap:4px;justify-items:end;font-size:14px}
.dact .ok{color:var(--green);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.dact .muted{display:inline-flex;gap:6px;align-items:center}
.sdform{display:grid;gap:6px;margin-top:12px}
.sdform>label{font-weight:600;font-size:14.5px;margin-top:8px}
.sdform fieldset{border:0;padding:0;margin:8px 0 0}
.sdform legend{font-weight:600;font-size:14.5px;margin-bottom:6px;padding:0}
.cbx{display:inline-flex;gap:6px;align-items:center;font-size:15px}
.cbx input{width:18px;height:18px;accent-color:var(--accent)}
select.field{background:var(--bg);color:var(--ink)}

@media (max-width:980px){
  .home-top{grid-template-columns:1fr;gap:30px}
  .forum{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:22px}
  .cols{grid-template-columns:1fr;gap:36px}
}
@media (max-width:680px){

  .tippop{position:fixed;left:12px;right:12px;top:64px;width:auto}
  .arow{padding-left:0;grid-template-columns:1fr;gap:2px}
  .hlist li{grid-template-columns:52px minmax(0,1fr)}

  .drow{grid-template-columns:44px minmax(0,1fr)}

  .chat-fab{bottom:84px;right:16px}
  .chatwrap.side{top:auto;left:0;width:auto;height:80vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;z-index:45;box-shadow:0 -10px 30px rgba(17,28,34,.18)}
  .chatwrap.full{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .chans{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .chans-h,.chan-s{display:none}
  .chan{white-space:nowrap}
  .chatwrap.full .msgs{padding:16px}

}
/* ---------- v5: home schedule ---------- */
.home-h{font-family:var(--display);font-size:23px;font-weight:600}

.sched{margin-top:4px}

.dtabs{display:flex;gap:8px;flex-wrap:wrap}
.dtab{border:1px solid var(--line-2);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 14px;text-align:left;display:grid;gap:1px;font-weight:600;font-size:14.5px;min-width:104px;cursor:pointer}
.dtab small{color:var(--brown);font-weight:600;font-size:12.5px}
.dtab:hover{border-color:var(--accent)}

.today{color:var(--green);font-size:12px;font-weight:700;margin-left:4px}
.srows{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.srow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 12px;border-bottom:1px solid var(--line)}
.stime{color:var(--brown);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;display:grid;gap:4px;justify-items:start}
a.sbody{text-decoration:none;color:var(--ink);display:grid;gap:2px}
.sk{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.dtbl{margin-top:8px}
.ago{color:var(--brown);font-weight:600}

.art2{max-width:68ch}
.afig-img{margin:6px 0 24px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;overflow:hidden}
.afig-img img{display:block;width:100%;height:auto}
.refs{font-family:var(--body);font-size:15px;line-height:1.55;padding-left:22px;margin:0}
.refs li{margin-bottom:8px}
.refs a{color:var(--accent-strong)}
.af{font-family:var(--body);font-size:14.5px;line-height:1.45;border:1px solid var(--line-2);border-radius:14px;padding:16px;margin:6px 0 26px;background:var(--bg)}
.af-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.af-t{font-size:16px}
.af-k{font-size:13px;color:var(--muted)}
.af-ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.af-seg,.af-sites{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.af-btn,.af-chip{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--bg);border:1.5px solid var(--line-2);border-radius:10px;padding:7px 16px;cursor:pointer}
.af-chip{border-radius:999px;padding:6px 14px}
.af-btn[aria-pressed="true"],.af-chip[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.af-sheet{width:100%;border-collapse:collapse;font-size:14px}
.af-sheet th{text-align:left;font-weight:700;background:var(--green-soft);border-top:1.5px solid var(--green);border-bottom:1.5px solid var(--green);padding:8px 10px}
.af-sheet td{padding:7px 10px;border-bottom:1px solid var(--line)}
.af-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.af-stats div{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px}
.af-stats span{display:block;font-size:13px;color:var(--muted)}
.af-stats b{font-size:26px}
.af-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.af-panel{border:1px solid var(--line-2);border-radius:12px;padding:12px}
.af-panel h4{margin:0 0 10px;font-size:14.5px}
.af-panel ul{list-style:none;margin:0;padding:0}
.af-panel li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.af-bar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13.5px;color:var(--muted)}
.af-bar span{flex:0 0 52px}
.af-bar i{display:block;height:14px;border-radius:5px;background:var(--green-soft);border:1.5px solid var(--green)}
.af-bar em{font-style:normal;color:var(--ink)}
.af-empty{color:var(--muted);margin:6px 0}
@media (max-width:620px){.af-stats,.af-panels{grid-template-columns:1fr}}
.reflect-q{font-size:17px;font-weight:600;margin:0 0 12px;max-width:62ch}
.myans{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:12px;padding:14px 16px}
.myans p{margin:4px 0 6px}
.peers-h{font-size:14px;font-weight:700;color:var(--muted);margin:24px 0 8px}
.peerans{list-style:none;margin:0;padding:0}
.peerans li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.peerans p{margin:3px 0 0}
</style>

const DASH_STAGE_OF = [0, 1, 2, 3, 2, 4, 1, 3, 2, 0, 3, 2, 4, 1, 2, 3, 0, 2, 3, 4, 1, 2, 3, 0, 2, 4, 1, 3, 2, 3, 1, 4, 2, 0, 3, 1];
let DASH = null;
function dashRows() {
  if (DASH) return DASH;
  let a = 7;
  const rnd = () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const day = 86400000, L = "ABCDEFGHJKLMNPRSTW";
  DASH = DASH_FIRST.map((f, i) => {
    const stage = DASH_STAGES[DASH_STAGE_OF[i]];
    const intake = DASH_TODAY - Math.round(12 + rnd() * 100) * day;
    const last = DASH_TODAY - Math.round(1 + rnd() * 26) * day;
    const next = last + (stage === "Placed" ? 30 : 14) * day;
    return { name: f + " " + L[Math.floor(rnd() * L.length)] + ".", cm: DASH_CMS[i % 3], office: rnd() < 0.5 ? "North" : "South", program: ["Adult", "Dislocated Worker", "Youth"][Math.floor(rnd() * 3)], stage, intake, last, next };
  });

}

    <p>Each stop describes a feature and why it's there.</p>
    <p>Everything works in this sample, including sharing and connecting with fictional peers. Nothing you type leaves this page.</p>
    <div class="tour-f"><button class="btn small quiet" data-act="tourEnd">Explore on my own</button><button class="btn small primary" data-act="tourGo" data-i="0">Take the tour ${ic("arrow", 15)}</button></div></div>`;
  const s = TOUR[tour.i], last = tour.i === TOUR.length - 1;
  return `<div class="tour${s.sel.includes("chat-fab") ? " up" : ""}" role="dialog" aria-label="Tour" aria-live="polite">
    <div class="tour-top"><div class="tour-dots" aria-hidden="true">${TOUR.map((_, j) => `<i class="${j === tour.i ? "on" : j < tour.i ? "past" : ""}"></i>`).join("")}</div><button class="ibtn" data-act="tourEnd" aria-label="End tour">${ic("x", 17)}</button></div>
    <span class="k">Stop ${tour.i + 1} of ${TOUR.length}</span>
    <h2>${s.t}</h2><p>${s.d}</p>${s.why ? `<div class="tour-why"><b>Why it's here</b><span>${s.why}</span></div>` : ""}
    <div class="tour-f"><button class="btn small" data-act="tourGo" data-i="${tour.i - 1}" ${tour.i === 0 ? "disabled" : ""}>Back</button><button class="btn small primary" data-act="${last ? "tourDone" : "tourGo"}" data-i="${tour.i + 1}">${last ? "Finish" : "Next"}</button></div></div>`;
}
function renderTour() { tourRoot.innerHTML = tour ? tourHTML() : ""; applyRing(); }
function tourStart() { tour = { i: -1 }; renderTour(); const b = tourRoot.querySelector(".btn.primary"); if (b) b.focus({ preventScroll: true }); }
function tourGo(i) {
  tour = { i };
  const s = TOUR[i];
  if (s.view === "session-3" && !ui.sview) ui.sview = "live";
  if (currentView() !== s.view) { location.hash = s.view; route(); }
  renderTour();
  scrollToEl(tourEl(s), true);
  const b = tourRoot.querySelector(".btn.primary"); if (b) b.focus({ preventScroll: true });
}
function tourEnd(msg) { tour = null; markSeen(); renderTour(); if (msg) toast(msg); }

// ---------- events ----------
function sendChat(ch, text, url) {
  const m = { who: "dana", text, when: "Just now" };
  if (url) m.url = url;
  (S.chat[ch] = S.chat[ch] || []).push(m); save();
  m.fresh = true; ui.chatBottom = true; ui.addLink = null; rerender(); delete m.fresh;
  if (S.replied[ch]) return;
  S.replied[ch] = true; save();
  setTimeout(() => { ui.typing = ch; ui.chatBottom = true; rerender(); }, 700);
  setTimeout(() => {
    ui.typing = null;
    const [who, t] = autoFor(ch), r = { who, text: t, when: "Just now" };
    S.chat[ch].push(r); save(); r.fresh = true; ui.chatBottom = true; rerender(); delete r.fresh;
  }, 2300);
}
function openChat(ch) {
  ui.chan = ch; ui.chat = ui.chat || "side"; S.chatSeen = true; save(); ui.chatBottom = true; rerender();
  const i = document.getElementById("chatin-c"); if (i) i.focus({ preventScroll: true });
}
function pageChan() { const { base } = parseHash(currentView()); return base.startsWith("session-") ? "s" + base.split("-")[1] : "general"; }
document.addEventListener("click", async (e) => {
  // close popovers on any click outside them
  let dirty = false;
  if (ui.tip && !e.target.closest(".tipwrap")) { ui.tip = false; dirty = true; }
