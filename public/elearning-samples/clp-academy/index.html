<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="canonical" href="https://communitylearningpartners.com/elearning-samples/clp-academy/"><link rel="icon" href="/favicon.png" type="image/png"></head><body>
<title>CLP Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap">
<style>
/* Layout: one course app. Sticky header with section tabs (bottom bar on phones), one content column per section, detail pages replace the column. */
:root{
  --bg:#ffffff;--surface:#f6f5f2;--surface-2:#edeae4;--ink:#1d2a31;--muted:#56636c;--line:#e3dfd8;--line-2:#d2ccc2;
  --accent:#1b6488;--accent-strong:#124b67;--accent-ink:#ffffff;--accent-soft:#e4eff5;
  --green:#2d7550;--green-soft:#e3f1e8;--brown:#87562a;--brown-soft:#f4eadf;
  --cvb:#dceaf2;--cvb1:#bcd7e7;--cvb2:#8dbad5;--cvg:#dff0e5;--cvg1:#b9dec7;--cvg2:#86c19e;--cvn:#f4e8da;--cvn1:#e7cfb2;--cvn2:#d3ac80;
  --shadow:0 1px 2px rgba(29,52,65,.07),0 8px 24px rgba(29,52,65,.08);
  --font-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-body:"Libre Franklin",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181b;--surface:#1a2226;--surface-2:#222c31;--ink:#e6ebee;--muted:#a2aeb6;--line:#2c373d;--line-2:#3a474e;
  --accent:#6db3d3;--accent-strong:#94c9e2;--accent-ink:#0b1a21;--accent-soft:#17303c;
  --green:#7cc49c;--green-soft:#163024;--brown:#d7a878;--brown-soft:#33281c;
  --cvb:#16303c;--cvb1:#1d4152;--cvb2:#2a5a72;--cvg:#152c21;--cvg1:#1d3d2d;--cvg2:#2b5a41;--cvn:#2c2318;--cvn1:#3d3021;--cvn2:#5a452e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b;--surface:#1a2226;--surface-2:#222c31;--ink:#e6ebee;--muted:#a2aeb6;--line:#2c373d;--line-2:#3a474e;
  --accent:#6db3d3;--accent-strong:#94c9e2;--accent-ink:#0b1a21;--accent-soft:#17303c;
  --green:#7cc49c;--green-soft:#163024;--brown:#d7a878;--brown-soft:#33281c;
  --cvb:#16303c;--cvb1:#1d4152;--cvb2:#2a5a72;--cvg:#152c21;--cvg1:#1d3d2d;--cvg2:#2b5a41;--cvn:#2c2318;--cvn1:#3d3021;--cvn2:#5a452e;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(26px,3.2vw,34px);letter-spacing:-.01em}
h1:focus{outline:none}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:8px;z-index:60;font-weight:600;text-decoration:none}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
.ic.fill{fill:currentColor;stroke:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:18px;height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px 6px 4px 0;text-align:left;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.mark .m1{fill:var(--accent-ink)}.mark .m2{fill:var(--accent-ink);opacity:.55}
.brand b{display:block;font-size:15px;letter-spacing:.01em}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;margin-left:10px}
.tab{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;border:0;background:none;color:var(--muted);font-weight:500;font-size:14.5px;position:relative;transition:color .2s,background .2s}
.tab:hover{color:var(--ink);background:var(--surface)}
.tab[aria-current="page"]{color:var(--accent-strong);background:var(--accent-soft)}
.tab .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.tour-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--accent-strong)}
.tour-btn:hover{border-color:var(--accent)}
.rprog{position:absolute;left:0;right:0;bottom:-1px;height:3px;background:transparent}
.rprog span{display:block;height:100%;width:0;background:var(--green);transition:width .1s linear}

.bnav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;background:var(--bg);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.bnav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px;min-height:50px;position:relative}
.bnav button[aria-current="page"]{color:var(--accent-strong);background:var(--accent-soft)}
.bnav .dot{position:absolute;top:6px;left:calc(50% + 8px);width:7px;height:7px;border-radius:50%;background:var(--green)}

.wrap{max-width:1200px;margin:0 auto;padding-block:30px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{min-height:60vh}
#view.enter{animation:enter .35s ease both}
@keyframes enter{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{max-width:1200px;margin:0 auto;padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot .ic{width:16px;height:16px}

@media (max-width:900px){.tabs{display:none}.bnav{display:flex}.brand small{max-width:52vw}}
@media (max-width:480px){.tour-btn span{display:none}.tour-btn{padding:8px}.top-r .av{display:none}}

/* shared */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);margin-bottom:6px}
.purpose{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:15px;margin-top:8px;max-width:62ch}
.purpose .ic{color:var(--accent);width:18px;height:18px}
.h2{font-family:var(--font-body);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.h3{font-family:var(--font-display);font-size:22px;font-weight:600}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font-weight:600;font-size:14px;min-height:40px;transition:background .2s,border-color .2s,transform .1s}
.btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:var(--accent-ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent-strong);padding-inline:10px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ibtn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center}
.ibtn:hover,.ibtn[aria-expanded="true"]{background:var(--surface-2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);font-size:13.5px;font-weight:500;color:var(--ink);min-height:34px;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip .ic{width:15px;height:15px;display:none}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.chip[aria-pressed="true"] .ic{display:block}
.tag{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:6px;white-space:nowrap}
.stage{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.stage::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-Idea{background:var(--brown-soft);color:var(--brown)}.s-Pilot{background:var(--accent-soft);color:var(--accent-strong)}.s-Results{background:var(--green-soft);color:var(--green)}.s-Draft{background:var(--surface-2);color:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex:none;letter-spacing:.02em}
.av.b{background:var(--accent-soft);color:var(--accent-strong)}.av.g{background:var(--green-soft);color:var(--green)}.av.n{background:var(--brown-soft);color:var(--brown)}
.av.sm{width:26px;height:26px;font-size:10.5px}.av.lg{width:52px;height:52px;font-size:17px}.av.xl{width:64px;height:64px;font-size:20px}
.avs{display:flex}.avs .av{border:2px solid var(--bg);margin-left:-8px}.avs .av:first-child{margin-left:0}
.muted{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent-strong);font-weight:600;font-size:14.5px;padding:6px 8px 6px 2px;margin-bottom:14px;border-radius:8px}
.back:hover{background:var(--accent-soft)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* reactions */
.reacts{display:flex;gap:8px;flex-wrap:wrap}
.rx{display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);font-size:14px;min-height:36px;transition:background .15s,border-color .15s}
.rx:hover{border-color:var(--accent)}
.rx[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.rx .e{font-size:16px;line-height:1;display:inline-block}
.rx .n{font-weight:600;font-variant-numeric:tabular-nums;font-size:13.5px}
.rx.pop .e{animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
.rx.sm{min-height:28px;padding:2px 8px 2px 6px;font-size:12.5px}.rx.sm .e{font-size:14px}.rx.sm .n{font-size:12.5px}

/* comments */
.cmts{margin-top:36px}
.cmts-h{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.cmts-h h2{font-family:var(--font-display);font-size:22px;font-weight:600}
.clist{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.cmt{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px}
.cmt.in{animation:slidein .35s ease both}
@keyframes slidein{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.cmt-meta{font-size:13.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cmt-meta b{font-weight:600}
.cmt-meta span{color:var(--muted);font-size:12.5px}
.cmt-text{margin-top:3px;overflow-wrap:anywhere}
.cmt-actions{margin-top:4px}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--accent-strong);font-weight:600;font-size:13px;display:inline-flex;gap:5px;align-items:center}
.linkbtn:hover{text-decoration:underline}
.replies{list-style:none;margin:12px 0 0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:14px}
.cform{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;margin-top:18px}
.cbox{border:1px solid var(--line-2);border-radius:12px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cbox textarea,.cbox input{width:100%;border:0;background:transparent;resize:vertical;min-height:44px;padding:11px 12px 4px;outline:none;display:block}
.cbox input{min-height:40px;padding:10px 12px 4px;font-weight:600}
.cbox-f{display:flex;justify-content:flex-end;gap:8px;padding:6px 8px 8px}
.mention{color:var(--accent-strong);font-weight:600}

/* home */
.home-grid{display:grid;grid-template-columns:1.1fr 1.2fr .9fr;gap:18px;margin-top:30px}
.home-grid .card{display:flex;flex-direction:column;gap:12px}
.kicker{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kicker .ic{width:17px;height:17px;color:var(--accent)}
.live-when{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.15}
.live-topic{color:var(--muted)}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.mp{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.mp .cover{border-radius:10px;aspect-ratio:1}
.mp .cover .cv-ic{display:none}
.mp h3{font-size:17px;font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13.5px}
.checks li{display:flex;gap:7px;align-items:center;color:var(--muted)}
.checks li .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.checks li.ok{color:var(--ink)}
.checks li.ok .ck{background:var(--green);border-color:var(--green);color:var(--bg)}
.checks .ck .ic{width:12px;height:12px;stroke-width:3}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.pulse-row{display:flex;gap:16px;align-items:center}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .rb{stroke:var(--surface-2)}
.ring .rf{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{fill:var(--ink);font:700 19px var(--font-body);text-anchor:middle;dominant-baseline:central}
.spark{display:flex;align-items:flex-end;gap:6px;height:56px}
.spark div{flex:1;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted);height:100%;align-content:end}
.spark i{display:block;width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--accent-soft);height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.spark div:last-child i{background:var(--accent)}
.feed{margin-top:34px}
.feed ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.feed li+li{border-top:1px solid var(--line)}
.feed button{width:100%;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;border:0;background:var(--bg);padding:13px 16px;transition:background .15s}
.feed button:hover{background:var(--surface)}
.feed .ft{font-size:14.5px;overflow-wrap:anywhere}
.feed .ft em{font-style:normal;font-weight:600;color:var(--accent-strong)}
.feed .fk{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;white-space:nowrap}
@media (max-width:980px){.home-grid{grid-template-columns:1fr 1fr}.home-grid .pulse{grid-column:1/-1}}
@media (max-width:700px){
  .home-grid{grid-template-columns:1fr}
}

/* gallery */
.toolbar{display:grid;gap:12px;margin-bottom:22px}
.search{position:relative;max-width:420px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{width:100%;border:1px solid var(--line-2);border-radius:999px;padding:10px 14px 10px 38px;background:var(--bg);min-height:42px}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.frow{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center}
.flabel{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:52px}
.count{font-size:13.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.pcard{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg);display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.pcard:hover,.pcard:focus-within{transform:translateY(-3px);box-shadow:var(--shadow)}
.pcard.new{animation:landed .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes landed{0%{opacity:.001;transform:translateY(-14px) scale(.97)}60%{opacity:1;transform:translateY(2px)}100%{transform:none}}
.pcard .newflag{position:absolute;top:12px;right:12px;background:var(--green);color:var(--bg);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;z-index:2}
.pc-b{padding:16px 18px 16px;display:flex;flex-direction:column;gap:9px;flex:1}
.pc-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pcard h3{font-size:18px;font-weight:600;line-height:1.3}
.stretch{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit}
.stretch::after{content:"";position:absolute;inset:0;z-index:1;border-radius:var(--r)}
.stretch:focus-visible{outline:none}
.pcard:has(.stretch:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pc-sum{color:var(--muted);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc-f{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:8px;font-size:13.5px}
.pc-who{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-stats{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--muted);white-space:nowrap}
.pc-stats .em{letter-spacing:-2px}
.pc-stats span{display:inline-flex;gap:4px;align-items:center}
.pc-stats .ic{width:15px;height:15px}
.cover{position:relative;aspect-ratio:2/1;overflow:hidden;background:var(--cvb)}
.cover svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.pcard:hover .cover svg{transform:scale(1.05)}
.cv-b{background:var(--cvb)}.cv-b .s1{fill:var(--cvb1)}.cv-b .s2,.cv-b .s3{fill:var(--cvb2)}.cv-b .s4{fill:var(--bg)}
.cv-g{background:var(--cvg)}.cv-g .s1{fill:var(--cvg1)}.cv-g .s2,.cv-g .s3{fill:var(--cvg2)}.cv-g .s4{fill:var(--bg)}
.cv-n{background:var(--cvn)}.cv-n .s1{fill:var(--cvn1)}.cv-n .s2,.cv-n .s3{fill:var(--cvn2)}.cv-n .s4{fill:var(--bg)}
.cv-ic{position:absolute;left:16px;bottom:14px;width:46px;height:46px;border-radius:13px;background:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow)}
.cv-b .cv-ic{color:var(--accent)}.cv-g .cv-ic{color:var(--green)}.cv-n .cv-ic{color:var(--brown)}
.cover.wide{aspect-ratio:3.4/1;border-radius:var(--r)}
.cover.wide .cv-ic{width:58px;height:58px;left:22px;bottom:20px}
.cover.wide .cv-ic .ic{width:28px;height:28px}

/* project detail */
.detail{max-width:860px;margin:0 auto}
.d-head{margin-top:22px;display:grid;gap:12px}
.byline{display:flex;gap:12px;align-items:center;font-size:14px}
.byline b{display:block;font-weight:600}
.byline span{color:var(--muted);font-size:13.5px}
.stages{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:0;counter-reset:st}
.stages li{position:relative;padding-top:24px;font-size:13.5px;font-weight:600;color:var(--muted)}
.stages li::before{content:"";position:absolute;top:7px;left:0;right:0;height:3px;background:var(--line)}
.stages li::after{content:"";position:absolute;top:0;left:0;width:17px;height:17px;border-radius:50%;background:var(--bg);border:3px solid var(--line-2)}
.stages li.done{color:var(--ink)}
.stages li.done::before{background:var(--green)}
.stages li.done::after{background:var(--green);border-color:var(--green)}
.stages li.cur::after{background:var(--bg);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.stages li.cur{color:var(--accent-strong)}
.stages li.cur::before{background:linear-gradient(90deg,var(--green) 0 8px,var(--line) 8px)}
.lede{font-family:var(--font-display);font-size:21px;line-height:1.5;margin-top:22px;max-width:62ch}
.d-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-h{font-family:var(--font-display);font-size:22px;font-weight:600;margin:34px 0 16px}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:18px;position:relative}
.tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;padding-left:32px}
.tl li::before{content:"";position:absolute;left:0;top:6px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
.tl li.in{animation:slidein .4s ease both}
.upd{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg)}
.upd-t{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.upd-t b{font-size:16px}
.upd-t span{font-size:12.5px;color:var(--muted)}
.upd p{margin-top:6px;color:var(--ink);font-size:15px}
.stat{margin-top:14px;display:grid;gap:8px;max-width:440px}
.stat-l{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.srow{display:grid;grid-template-columns:72px minmax(0,1fr) 48px;align-items:center;gap:10px;font-size:13px}
.srow .bar{height:12px}
.srow .bar span{width:0}
.srow.before .bar span{background:var(--line-2)}
.srow b{font-variant-numeric:tabular-nums;text-align:right}
.uform{border:1px solid var(--line-2);border-radius:12px;margin-bottom:18px}

/* resources */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.rcard{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.rcard:hover,.rcard:focus-within{transform:translateY(-3px);box-shadow:var(--shadow)}
.rcard:has(.stretch:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.rc-b{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.fmt{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.fmt .ic{width:16px;height:16px}
.f-article{color:var(--brown)}.f-walk{color:var(--accent-strong)}.f-gif{color:var(--green)}.f-compare{color:var(--brown)}.f-rec{color:var(--accent-strong)}
.rcard h3{font-size:18px;font-weight:600;line-height:1.3}
.rc-f{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:auto;padding-top:6px}
.rc-f .pc-stats{margin-left:auto}
.th{height:150px;background:var(--surface);position:relative;overflow:hidden;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.th-art .pg{width:62%;background:var(--bg);border-radius:8px;padding:16px;display:grid;gap:8px;box-shadow:var(--shadow);transform:rotate(-2deg);transition:transform .4s}
.rcard:hover .th-art .pg{transform:rotate(0) translateY(-3px)}
.th-art i{display:block;height:7px;border-radius:4px;background:var(--surface-2)}
.th-art i.t{height:11px;width:70%;background:var(--line-2)}
.th-art i.hl{background:var(--green-soft);box-shadow:inset 0 -3px 0 var(--green)}
.th-art i.s{width:55%}
.th-walk{grid-template-columns:repeat(3,auto);gap:10px}
.th-walk .st{width:58px;height:44px;border-radius:8px;background:var(--bg);border:1px solid var(--line);position:relative;box-shadow:var(--shadow)}
.th-walk .st b{position:absolute;top:-9px;left:-9px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center}
.th-walk .st i{position:absolute;left:8px;right:8px;bottom:8px;height:6px;border-radius:3px;background:var(--surface-2)}
.th-walk .st.on{border-color:var(--accent)}
.th-walk .st.on i{background:var(--accent-soft)}
.th-walk .cursor{position:absolute;width:18px;height:18px;color:var(--ink);left:30%;top:58%;transition:left .8s,top .8s}
.rcard:hover .th-walk .cursor{left:62%;top:40%}
.th-gif .frame{width:66%;height:96px;background:var(--bg);border-radius:8px;box-shadow:var(--shadow);display:flex;align-items:flex-end;gap:8px;padding:12px 14px}
.th-gif .frame i{flex:1;background:var(--green-soft);border-radius:4px 4px 1px 1px;height:30%;transition:height .5s}
.th-gif .frame i:nth-child(2){height:55%}.th-gif .frame i:nth-child(3){height:42%}.th-gif .frame i:nth-child(4){height:70%}
.rcard:hover .th-gif .frame i{background:var(--green);animation:gbar 1.2s ease-in-out infinite alternate}
.rcard:hover .th-gif .frame i:nth-child(2){animation-delay:.15s}.rcard:hover .th-gif .frame i:nth-child(3){animation-delay:.3s}.rcard:hover .th-gif .frame i:nth-child(4){animation-delay:.45s}
@keyframes gbar{from{height:20%}to{height:85%}}
.gifbadge{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;letter-spacing:.08em;background:var(--ink);color:var(--bg);padding:3px 7px;border-radius:5px}
.th-compare .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:72%}
.th-compare .pair div{background:var(--bg);border-radius:8px;padding:12px;display:grid;gap:6px;box-shadow:var(--shadow)}
.th-compare .pair i{display:block;height:6px;border-radius:3px;background:var(--surface-2)}
.th-compare .pair div:first-child i:nth-child(2){background:var(--brown-soft);box-shadow:inset 0 -2px 0 var(--brown)}
.th-compare .pair div:last-child i:nth-child(2){background:var(--green-soft);box-shadow:inset 0 -2px 0 var(--green)}
.th-rec .vid{width:68%;aspect-ratio:16/9;background:#124b67;border-radius:10px;position:relative;display:grid;place-items:center;box-shadow:var(--shadow)}
.th-rec .vid .play{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#124b67;transition:transform .25s}
.rcard:hover .th-rec .play{transform:scale(1.12)}
.th-rec .vid .tl2{position:absolute;left:10px;right:10px;bottom:9px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.th-rec .vid .tl2 i{position:absolute;top:-2px;width:2px;height:8px;background:#fff}
.th-rec .vid .tl2 b{position:absolute;left:0;top:0;bottom:0;width:35%;background:#fff;border-radius:2px}

/* reader + resource pages */
.reader{max-width:720px;margin:0 auto}
.r-title{font-family:var(--font-display);font-size:clamp(28px,4vw,40px);font-weight:600;line-height:1.15;margin-top:10px}
.r-body{font-family:var(--font-display);font-size:19.5px;line-height:1.7;margin-top:28px;display:grid;gap:22px}
.hl{font:inherit;color:inherit;text-align:left;border:0;padding:0 2px;background:linear-gradient(transparent 58%,var(--green-soft) 58%);border-bottom:2px solid var(--green);border-radius:2px;cursor:pointer;display:inline;line-height:inherit;transition:background .2s}
.hl:hover,.hl[aria-expanded="true"]{background:var(--green-soft)}
.hl sup{font-family:var(--font-body);font-size:11px;font-weight:700;color:var(--green);margin-left:3px}
.mnote{font-family:var(--font-body);font-size:15px;line-height:1.5;border-left:3px solid var(--green);background:var(--surface);border-radius:0 12px 12px 0;padding:14px 16px;display:grid;gap:12px;animation:slidein .3s ease both}
.mnote-h{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green)}
.mnote ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.mnote li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14.5px}
.mnote li b{font-weight:600}
.mnote form{display:flex;gap:8px}
.mnote input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:999px;padding:8px 14px;background:var(--bg)}
.mnote input:focus{outline:none;border-color:var(--accent)}
.pullq{font-family:var(--font-display);font-size:28px;line-height:1.3;font-weight:600;color:var(--accent-strong);padding:6px 0 6px 22px;border-left:4px solid var(--accent);margin:4px 0}
.r-react{margin-top:34px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

.wk{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start;margin-top:24px}
.mock{position:relative;aspect-ratio:16/10.5;border:1px solid var(--line-2);border-radius:14px;background:var(--bg);overflow:hidden;box-shadow:var(--shadow);font-size:12px}
.mock-bar{height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.mock-bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2)}
.mock-bar span{margin-left:10px;font-weight:600;color:var(--muted);font-size:11.5px}
.mock-body{position:absolute;top:30px;left:0;right:0;bottom:0;display:grid;grid-template-columns:24% 1fr}
.mock-side{border-right:1px solid var(--line);background:var(--surface);padding:10px;display:grid;align-content:start;gap:6px}
.mock-side .ms{border-radius:6px;padding:6px 8px;background:transparent;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mock-side .ms.nb{background:var(--bg);border:1px solid var(--line);color:var(--ink);font-weight:600}
.mock-side .ms.cap{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:8px 8px 0}
.mock-side .ms.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.mock-main{position:relative;display:flex;flex-direction:column;padding:14px;gap:10px;min-width:0}
.bub{max-width:82%;border-radius:12px;padding:9px 11px;line-height:1.45;font-size:11.5px}
.bub.me{align-self:flex-end;background:var(--accent-soft);color:var(--ink)}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.bub.ai ol{margin:4px 0 0;padding-left:16px}
.mock-comp{margin-top:auto;border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;min-height:46px;color:var(--muted);font-size:11.5px;line-height:1.45;position:relative;background:var(--bg)}
.mock-comp.typed{color:var(--ink)}
.mock-menu{position:absolute;right:16px;bottom:64px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;box-shadow:var(--shadow);padding:5px;display:grid;min-width:42%;animation:slidein .3s ease both}
.mock-menu span{padding:7px 10px;border-radius:6px;font-size:11.5px}
.mock-menu span.on{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.hot{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;border:2.5px solid var(--accent);pointer-events:none;animation:hot 1.6s ease-out infinite;transition:left .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1)}
@keyframes hot{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 16px color-mix(in srgb,var(--accent) 0%,transparent)}}
.cur{position:absolute;width:22px;height:22px;color:var(--ink);pointer-events:none;transition:left .9s cubic-bezier(.3,.7,.2,1),top .9s cubic-bezier(.3,.7,.2,1);filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.cur .ic{width:22px;height:22px}
.cur .ic path{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
.wk-side{display:grid;gap:16px}
.wk-num{font-family:var(--font-display);font-size:56px;line-height:1;font-weight:600;color:var(--accent)}
.wk-num small{font-size:20px;color:var(--muted);font-weight:500}
.wk-side h2{font-size:22px;font-family:var(--font-display);font-weight:600}
.wk-side p{color:var(--muted)}
.segs{display:flex;gap:6px}
.segs button{flex:1;height:8px;border-radius:99px;border:0;background:var(--surface-2);padding:0;transition:background .3s}
.segs button.on{background:var(--accent)}
.segs button:hover{background:var(--accent-soft)}
.segs button.on:hover{background:var(--accent-strong)}
.wk-nav{display:flex;gap:10px}
.done-card{text-align:center;display:grid;gap:12px;justify-items:center;padding:28px;border:1px solid var(--line);border-radius:var(--r);background:var(--green-soft)}
.done-card .big{width:64px;height:64px;border-radius:50%;background:var(--green);color:var(--bg);display:grid;place-items:center;animation:pop .6s ease}
.done-card .big .ic{width:32px;height:32px;stroke-width:2.6}

.gifwrap{margin-top:24px;display:grid;gap:14px}
.gif{position:relative;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:var(--bg)}
.gif .mock-bar{position:relative}
.gif-body{display:grid;grid-template-columns:1.1fr 1fr;min-height:300px}
.g-sheet{padding:14px;border-right:1px solid var(--line);overflow-x:auto}
.g-sheet table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.g-sheet th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 6px}
.g-sheet td{padding:7px 6px;border-bottom:1px solid var(--line)}
.g-sheet tr.in{animation:slidein .3s ease both}
.g-ai{padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.g-label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.g-prompt{min-height:44px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;font-size:12.5px}
.g-ans{min-height:58px;font-size:13px;line-height:1.5}
.g-prompt:not(:empty)::after,.g-ans:not(:empty)::after{content:"";display:inline-block;width:2px;height:1em;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
.gif[data-phase="2"] .g-prompt::after,.gif[data-phase="3"] .g-prompt::after,.gif[data-phase="3"] .g-ans::after,.gif.paused .g-prompt::after,.gif.paused .g-ans::after{display:none}
@keyframes blink{50%{opacity:0}}
.g-bars{display:grid;gap:6px;margin-top:auto}
.g-bars div{display:grid;grid-template-columns:86px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:11.5px}
.g-bars span{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden;display:block}
.g-bars span i{display:block;height:100%;width:0;background:var(--green);border-radius:5px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.g-bars div.low span i{background:var(--brown)}
.g-bars b{font-variant-numeric:tabular-nums;text-align:right;opacity:0;transition:opacity .4s .5s}
.g-bars.on b{opacity:1}
.gif-ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gif-steps{display:flex;gap:6px;margin-left:auto}
.gif-steps span{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);color:var(--muted);transition:background .3s,color .3s}
.gif-steps span.on{background:var(--green-soft);color:var(--green)}

.ba{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.ba-pane{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--bg);display:grid;gap:12px;align-content:start}
.ba-pane h2{font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.ba-pane.before h2{color:var(--brown)}.ba-pane.after h2{color:var(--green)}
.ba-text{font-size:16.5px;line-height:1.65}
.ba-text mark{background:transparent;color:inherit;padding:1px 2px;border-radius:3px;transition:background .25s,box-shadow .25s}
.before .ba-text mark{box-shadow:inset 0 -2px 0 var(--brown)}
.after .ba-text mark{box-shadow:inset 0 -2px 0 var(--green)}
.before .ba-text mark.on{background:var(--brown-soft)}
.after .ba-text mark.on{background:var(--green-soft)}
.ba-text mark sup{font-size:10.5px;font-weight:700;margin-left:2px}
.before mark sup{color:var(--brown)}.after mark sup{color:var(--green)}
.ba-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
.ba-key{text-align:left;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:14px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;transition:border-color .2s,background .2s}
.ba-key b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:13px}
.ba-key strong{display:block;font-size:14.5px}
.ba-key span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.ba-key[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.ba-key[aria-pressed="true"] b{background:var(--green);color:var(--bg)}

.rec{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;margin-top:24px;align-items:start}
.player{border-radius:var(--r);overflow:hidden;background:#124b67;color:#fff;box-shadow:var(--shadow)}
.stagev{aspect-ratio:16/9;position:relative;display:grid;place-items:center;padding:24px;text-align:center}
.stagev .slide{display:grid;gap:14px;justify-items:center;animation:enter .45s ease both}
.stagev .slide .sic{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.stagev .slide .sic .ic{width:32px;height:32px;stroke:#fff}
.stagev .slide h3{font-family:var(--font-display);font-size:clamp(20px,3vw,30px);font-weight:600;color:#fff}
.stagev .slide p{color:rgba(255,255,255,.85);font-size:14.5px;max-width:42ch}
.stagev .live{position:absolute;top:14px;left:14px;font-size:11px;font-weight:700;letter-spacing:.08em;background:rgba(255,255,255,.16);padding:4px 9px;border-radius:5px;text-transform:uppercase}
.pctl{display:flex;align-items:center;gap:12px;padding:10px 14px 14px}
.pbtn{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#124b67;display:grid;place-items:center;flex:none}
.pbtn .ic{color:#1b4f6b}
.ptrack{flex:1;position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
.ptrack .pf{position:absolute;left:0;top:0;bottom:0;background:#fff;border-radius:3px;width:0;transition:width .25s linear}
.ptrack button{position:absolute;top:-7px;width:14px;height:20px;margin-left:-7px;border:0;background:transparent;padding:0}
.ptrack button::after{content:"";position:absolute;left:6px;top:4px;width:2px;height:12px;background:#fff;border-radius:1px;opacity:.85}
.ptime{font-size:12.5px;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.92);white-space:nowrap}
.player :focus-visible{outline-color:#fff}
.chaps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.chaps button{width:100%;display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;font-size:14.5px;align-items:baseline}
.chaps button:hover{background:var(--surface)}
.chaps button span{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.chaps button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.chaps button[aria-current="true"] span{color:var(--accent-strong)}
.livechat{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.livechat ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.livechat li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14px;animation:slidein .3s ease both}
.transcript{margin-top:16px;font-size:15px;color:var(--muted);font-style:italic;border-left:3px solid var(--line-2);padding-left:14px}

/* chat */
.chat{display:grid;grid-template-columns:250px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;height:min(740px,calc(100vh - 220px));min-height:480px;background:var(--bg)}
.chans{background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.chans-h{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.chans ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.chan{width:100%;display:flex;align-items:center;gap:8px;border:0;background:none;padding:8px 10px;border-radius:9px;font-size:14.5px;color:var(--ink);text-align:left}
.chan .ic{width:17px;height:17px;color:var(--muted)}
.chan span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chan:hover{background:var(--surface-2)}
.chan[aria-current="true"]{background:var(--bg);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.chan[aria-current="true"] .ic{color:var(--accent)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.chan .livepill{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--green);text-transform:uppercase}
.online{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px}
.online .av{position:relative}
.online .av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;background:var(--green);border:2px solid var(--surface)}
.cmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.chead h2{font-size:16px;font-weight:700;display:flex;gap:6px;align-items:center}
.chead h2 .ic{width:17px;height:17px;color:var(--muted)}
.chead p{font-size:13px;color:var(--muted)}
.chead .mem{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}
.chead .mem .ic{width:16px;height:16px}
.msgs{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px;min-height:0}
.msgs:focus-visible{outline-offset:-2px}
.daysep{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;color:var(--muted);margin:8px 8px 6px}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:8px;border-radius:10px;transition:background .15s}
.msg:hover,.msg:focus-within{background:var(--surface)}
.msg.in{animation:slidein .35s ease both}
.msg .av{width:36px;height:36px}
.mh{display:flex;gap:8px;align-items:baseline;font-size:14px}
.mh b{font-weight:600}
.mh span{font-size:12px;color:var(--muted)}
.mh .role{font-size:11px;font-weight:700;color:var(--brown);background:var(--brown-soft);padding:1px 6px;border-radius:5px}
.mt{font-size:15px;overflow-wrap:anywhere;white-space:pre-wrap}
.mrx{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.addrx{width:30px;height:28px;border-radius:999px;border:1px dashed var(--line-2);background:var(--bg);color:var(--muted);display:inline-grid;place-items:center}
.addrx .ic{width:16px;height:16px}
.addrx:hover,.addrx[aria-expanded="true"]{border-style:solid;border-color:var(--accent);color:var(--accent)}
.popwrap{position:relative;display:inline-flex}
.pop{position:absolute;z-index:15;background:var(--bg);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow);padding:6px;animation:slidein .2s ease both}
.pop.emo{bottom:calc(100% + 6px);left:0;display:flex;gap:2px}
.pop.emo button{width:36px;height:36px;border:0;background:none;border-radius:8px;font-size:19px}
.pop.emo button:hover{background:var(--surface-2)}
.pop.list{bottom:calc(100% + 8px);left:0;width:min(320px,80vw);display:grid;gap:2px;max-height:300px;overflow-y:auto}
.pop.list p{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px}
.pop.list button{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:8px;font-size:14px}
.pop.list button:hover{background:var(--surface)}
.pop.list .ic{width:18px;height:18px;color:var(--accent)}
.mcard{margin-top:8px;max-width:420px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);text-align:left;width:100%;transition:border-color .2s}
.mcard:hover{border-color:var(--accent)}
.mcard .mci{width:52px;height:52px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.mcard .mci.g{background:var(--green-soft);color:var(--green)}.mcard .mci.n{background:var(--brown-soft);color:var(--brown)}
.mcard b{display:block;font-size:14.5px;line-height:1.3}
.mcard span{display:block;font-size:12.5px;color:var(--muted)}
.poll{margin-top:8px;max-width:440px;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;background:var(--bg)}
.poll-q{font-weight:600;font-size:14.5px;display:flex;gap:8px;align-items:center}
.poll-q .ic{color:var(--accent);width:18px;height:18px}
.popt{position:relative;display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line-2);border-radius:9px;padding:8px 12px;background:var(--bg);overflow:hidden;text-align:left;font-size:14px}
.popt i{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);width:0;transition:width .7s cubic-bezier(.2,.8,.2,1);z-index:0}
.popt span,.popt b{position:relative;z-index:1}
.popt b{font-variant-numeric:tabular-nums;font-size:13px}
.popt[aria-pressed="true"]{border-color:var(--accent)}
.popt[aria-pressed="true"] i{background:color-mix(in srgb,var(--accent) 22%,var(--bg))}
.poll small{color:var(--muted);font-size:12px}
.typing{display:flex;gap:10px;align-items:center;padding:6px 10px;font-size:13px;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-4px);opacity:1}}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:end}
.cmp-tools{display:flex;gap:2px}
.composer textarea{border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;min-height:42px;max-height:140px;resize:none;background:var(--bg);width:100%;display:block;line-height:1.45}
.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.send{width:42px;height:42px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.send:hover{background:var(--accent-strong)}
@media (max-width:760px){
  .chat{grid-template-columns:1fr;height:calc(100vh - 250px);height:calc(100dvh - 250px);min-height:440px}
  .chans{flex-direction:row;padding:8px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;gap:0}
  .chans-h,.online{display:none}
  .chans ul{display:flex;gap:6px}
  .chan{white-space:nowrap;padding:7px 12px;border-radius:999px;font-size:14px}
  .chead p{display:none}
}

/* coaching */
.coach{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:22px;align-items:start}
.coach-col{display:grid;gap:18px}
.coach-me{display:flex;gap:14px;align-items:center}
.coach-me b{display:block;font-size:17px}
.coach-me span{display:block;color:var(--muted);font-size:13.5px}
.focus{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.next-s{display:grid;gap:12px}
.next-when{font-family:var(--font-display);font-size:22px;font-weight:600}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.slot{border:1px solid var(--line-2);border-radius:10px;background:var(--bg);padding:10px 12px;text-align:left;font-size:14px;display:grid;gap:1px;transition:border-color .15s,background .15s}
.slot span{font-size:12px;color:var(--muted)}
.slot:hover{border-color:var(--accent)}
.slot[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.booked{display:flex;gap:12px;align-items:center;background:var(--green-soft);color:var(--ink);border-radius:12px;padding:12px 14px;animation:slidein .35s ease both}
.booked .ic{color:var(--green)}
.goals{display:grid;gap:12px}
.goal{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0;padding-top:4px}
.goal .ring{width:56px;height:56px}
.goal .ring circle{stroke-width:7}
.goal .ring text{font-size:13px}
.goal h3{font-size:15.5px;font-weight:600;margin-bottom:6px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.steps label{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer;padding:3px 0}
.steps input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);background:var(--bg);display:grid;place-items:center;margin:0;flex:none;cursor:pointer;transition:background .15s,border-color .15s}
.steps input:checked{background:var(--green);border-color:var(--green)}
.steps input:checked::after{content:"";width:9px;height:5px;border-left:2.4px solid var(--bg);border-bottom:2.4px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.steps input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-2)}
.thread{display:flex;flex-direction:column;height:100%;min-height:520px;padding:0;overflow:hidden}
.thread-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.thread-h .ic{color:var(--accent)}
.thread-h b{font-size:15.5px}
.thread-h span{font-size:12.5px;color:var(--muted);margin-left:auto;display:flex;gap:5px;align-items:center}
.tmsgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;max-height:520px}
.tm{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;max-width:92%}
.tm .av{width:30px;height:30px;font-size:11px}
.tm.me{align-self:flex-end;grid-template-columns:minmax(0,1fr)}
.tm.me .av{display:none}
.tbub{background:var(--surface);border-radius:4px 14px 14px 14px;padding:10px 13px;font-size:14.5px;overflow-wrap:anywhere}
.tm.me .tbub{background:var(--accent);color:var(--accent-ink);border-radius:14px 4px 14px 14px}
.tm small{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.tm.me small{text-align:right}
.tm.in{animation:slidein .35s ease both}
.starters{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 10px}
.tform{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.tform textarea{border:1px solid var(--line-2);border-radius:12px;padding:9px 12px;min-height:42px;resize:none;background:var(--bg);line-height:1.45}
.tform textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sessions{margin-top:26px}
.strack{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.strack li{position:relative}
.strack li::before{content:"";position:absolute;top:19px;left:-50%;width:100%;height:3px;background:var(--green)}
.strack li:first-child::before{display:none}
.strack li.up::before{background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 11px)}
.strack button{position:relative;z-index:1;display:grid;justify-items:center;gap:8px;border:0;background:none;width:100%;padding:0 4px 4px;border-radius:12px;text-align:center}
.strack .sd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:var(--bg);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--green);transition:transform .2s,box-shadow .2s}
.strack .sd .ic{width:18px;height:18px;stroke-width:2.4}
.strack li.up .sd{background:var(--bg);color:var(--accent);box-shadow:0 0 0 2px var(--line-2)}
.strack button[aria-pressed="true"] .sd{transform:scale(1.12);box-shadow:0 0 0 2px var(--accent),0 0 0 7px var(--accent-soft)}
.strack b{font-size:14px}
.strack span{font-size:12.5px;color:var(--muted)}
.snote{margin-top:18px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;animation:slidein .3s ease both}
.snote h3{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:6px}
.snote ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.snote li{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.snote li .ic{color:var(--green);margin-top:2px;width:18px;height:18px}
.snote blockquote{margin:12px 0 0;font-family:var(--font-display);font-size:17px;color:var(--accent-strong);border-left:3px solid var(--accent);padding-left:14px}
@media (max-width:900px){.coach{grid-template-columns:1fr}.snote{grid-template-columns:1fr}}
@media (max-width:560px){.strack b{font-size:13px}.strack span{font-size:11.5px}.slots{grid-template-columns:1fr 1fr}}

/* digest */
.dseg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;position:relative}
.dseg button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;gap:7px;align-items:center;transition:background .2s,color .2s}
.dseg button[aria-pressed="true"]{background:var(--bg);color:var(--accent-strong);box-shadow:var(--shadow)}
.dg{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;margin-top:22px;align-items:start}
.dside{display:grid;gap:18px;position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
.dside h2{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.srcs{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.srcs label{display:grid;grid-template-columns:20px 28px minmax(0,1fr);gap:10px;align-items:center;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:14px}
.srcs label:hover{background:var(--surface)}
.srcs label span small{display:block;font-size:12px;color:var(--muted)}
.srcs .si{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-strong)}
.srcs .si .ic{width:16px;height:16px}
.srcs .si.g{background:var(--green-soft);color:var(--green)}.srcs .si.n{background:var(--brown-soft);color:var(--brown)}
.cbx{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);display:grid;place-items:center;margin:0;cursor:pointer;background:var(--bg)}
.cbx:checked{background:var(--accent);border-color:var(--accent)}
.cbx:checked::after{content:"";width:9px;height:5px;border-left:2.4px solid var(--accent-ink);border-bottom:2.4px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.cbx:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:grid;gap:6px}
.field label,.flab{font-size:13px;font-weight:600}
.field select,.field input[type="text"],.field textarea{border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;background:var(--bg);min-height:42px;width:100%}
.field select:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.aud{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.aud b{color:var(--ink)}
.email{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg);box-shadow:var(--shadow)}
.email-meta{display:grid;gap:4px;padding:12px 18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted);background:var(--surface)}
.email-meta b{color:var(--ink);font-weight:600}
.nl{max-width:600px;margin:0 auto;padding:0 0 28px}
.nl-hero{background:linear-gradient(135deg,var(--accent-soft),var(--green-soft) 70%,var(--brown-soft));padding:34px 28px 26px}
.nl-hero small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-strong)}
.nl-hero h2{font-family:var(--font-display);font-size:30px;font-weight:600;margin-top:6px}
.nl-hero p{color:var(--muted);font-size:13.5px;margin-top:8px;display:flex;gap:8px;align-items:center}
.nl-sec{padding:22px 28px 0}
.nl-sec.in{animation:slidein .45s cubic-bezier(.2,.8,.2,1) both}
.nl-src{display:inline-flex;gap:5px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.nl-src .ic{width:13px;height:13px}
.nl-sec h3{font-family:var(--font-display);font-size:20px;font-weight:600;margin-bottom:6px}
.nl-sec p{font-size:15px}
.nl-feat{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:8px}
.nl-feat .cover{aspect-ratio:3/1}
.nl-feat div.b{padding:14px 16px;display:grid;gap:6px}
.nl-feat .pc-stats{margin-left:0}
.nl-quote{font-family:var(--font-display);font-size:19px;line-height:1.45;border-left:3px solid var(--green);padding-left:14px}
.nl-who{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13.5px;color:var(--muted)}
.nl-cta{display:inline-flex;margin-top:12px;background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
.merge{background:var(--accent-soft);color:var(--accent-strong);border-radius:4px;padding:0 4px;font-weight:600}

.chart rect{transition:height .8s cubic-bezier(.2,.8,.2,1),y .8s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}

.top3 li b{font-family:var(--font-display);font-size:18px;color:var(--accent)}

/* home: featured pieces, feed, peer chat */
.home-vh{align-items:center}
.nextlive{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);flex-wrap:wrap}

.sec-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}

.fcard.big h3{font-family:var(--font-display);font-size:25px}

@media (max-width:980px){.feat{grid-template-columns:1fr 1fr}.fcard.big{grid-row:auto;grid-column:1/-1}.fcard.wide{grid-column:1/-1}}
@media (max-width:640px){.feat{grid-template-columns:1fr}.fcard.wide{flex-direction:column}.fcard.wide .fviz{width:auto;border-right:0;border-bottom:1px solid var(--line)}.fcard.big .fviz{min-height:210px}}
.fv{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--ink)}
.fv-art{grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);grid-template-rows:auto auto auto;gap:12px 0;padding:18px;align-content:center;place-items:stretch}
.fa-ai{grid-column:1/-1;justify-self:center;display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-weight:700;color:var(--brown)}
.fa-ai small{color:var(--muted);font-weight:500}
.fa-sheet,.fa-dash{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;box-shadow:var(--shadow);align-content:start;min-height:92px}
.fa-sheet b,.fa-dash b{font-size:11.5px}
.fa-sheet i{display:block;height:6px;border-radius:3px;background:var(--cvb1)}
.fa-lane{position:relative;align-self:center;height:3px;background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 10px)}
.fa-lane .dot{position:absolute;top:-3px;left:0;width:9px;height:9px;border-radius:50%;background:var(--accent);animation:lane 2.4s linear infinite}
.fa-lane .dot:nth-child(2){animation-delay:.8s}.fa-lane .dot:nth-child(3){animation-delay:1.6s}
@keyframes lane{0%{left:0;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:calc(100% - 9px);opacity:0}}
.fa-bars{display:flex;align-items:flex-end;gap:5px;height:50px}

.fa-bars i:nth-child(2){animation-delay:.5s}.fa-bars i:nth-child(3){animation-delay:1s}
@keyframes grow{from{height:25%}to{height:92%}}
.fa-no{grid-column:1/-1;justify-self:center;display:inline-flex;gap:5px;align-items:center;font-weight:700;font-size:11.5px;color:var(--brown);border:1.5px dashed var(--brown);border-radius:999px;padding:3px 10px;background:var(--bg)}
.fv-slow{display:grid;gap:12px;padding:18px 22px;align-content:center;place-items:stretch}
.fs-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:4px 10px;align-items:center}
.fs-l{font-weight:700;font-size:12px}
.fs-t{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}

.fs-t i.fast{background:var(--green);animation:ffast 7s linear infinite}
.fs-v{grid-column:2;font-size:11.5px;font-weight:700;opacity:0}

.fs-v.good{color:var(--green);animation:fv2 7s linear infinite}
.fs-file{justify-self:center;display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;font-weight:600;opacity:0;animation:fv3 7s linear infinite}
@keyframes fslow{0%{width:0}45%,100%{width:100%}}
@keyframes fv1{0%,46%{opacity:0}50%,100%{opacity:1}}
@keyframes fv3{0%,52%{opacity:0;transform:translateY(-4px)}58%,100%{opacity:1;transform:none}}
@keyframes ffast{0%,62%{width:0}66%,100%{width:100%}}
@keyframes fv2{0%,67%{opacity:0}71%,100%{opacity:1}}
.fv-pod{grid-template-columns:auto auto auto;gap:14px;padding:16px;align-items:center;justify-content:center}
.fp-docs{display:grid;gap:6px}
.fp-docs span{display:flex;gap:5px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:11px;font-weight:600;animation:fpd 7s ease infinite}
.fp-docs span:nth-child(2){animation-delay:.25s}.fp-docs span:nth-child(3){animation-delay:.5s}
.fp-docs .ic{color:var(--accent)}
@keyframes fpd{0%{transform:translateX(-10px);opacity:0}8%,100%{transform:none;opacity:1}}
.fp-nb{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-weight:700;font-size:11px;color:var(--accent-strong);animation:fpn 7s ease infinite}
@keyframes fpn{0%,22%{transform:scale(1)}27%{transform:scale(1.08)}32%,100%{transform:scale(1)}}
.fp-out{display:grid;gap:8px;justify-items:center}
.fp-vid{width:84px;aspect-ratio:16/9;border-radius:8px;background:#124b67;display:grid;place-items:center;color:#fff;animation:fpv 7s ease infinite}
@keyframes fpv{0%,32%{opacity:0;transform:scale(.8)}40%,100%{opacity:1;transform:none}}
.fp-list{display:grid;gap:4px;width:84px}
.fp-list i{display:block;height:8px;border-radius:4px;background:var(--surface-2)}
.fp-list i.new{background:var(--green);animation:fpl 7s ease infinite}
@keyframes fpl{0%,55%{opacity:0;transform:translateY(-8px)}64%,100%{opacity:1;transform:none}}
.fw-win{width:84%;max-width:330px;background:var(--bg);border:1px solid var(--line-2);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.fw-bar{height:24px;display:flex;align-items:center;gap:5px;padding:0 9px;background:var(--surface);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--muted)}
.fw-bar i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.fw-bar span{margin-left:6px}
.fw-live{margin-left:auto;background:var(--green-soft);color:var(--green);font-size:10px;padding:1px 7px;border-radius:999px;animation:fwl 7s ease infinite}
.fw-body{position:relative;padding:10px;display:grid;gap:8px}
.fw-k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fw-k span{background:var(--surface);border-radius:6px;padding:6px;font-size:9.5px;color:var(--muted);display:grid;animation:fwk 7s ease infinite}
.fw-k span:nth-child(2){animation-delay:.25s}.fw-k span:nth-child(3){animation-delay:.5s}

.fw-rows{display:grid;gap:5px}
.fw-rows i{display:block;height:7px;border-radius:4px;background:var(--cvb1);animation:fwk 7s ease infinite}
.fw-rows i:nth-child(2){animation-delay:.6s;width:80%}.fw-rows i:nth-child(3){animation-delay:.8s;width:60%}
.fw-btn{justify-self:end;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;animation:fwb 7s ease infinite}
.fw-cur{position:absolute;left:calc(100% - 34px);top:calc(100% - 24px);width:18px;height:18px;animation:fwc 7s ease infinite}

.fw-cur .ic path{fill:var(--bg);stroke:var(--ink);stroke-width:1.6}
@keyframes fwk{0%{opacity:0;transform:translateY(5px)}10%,100%{opacity:1;transform:none}}
@keyframes fwc{0%,25%{left:20%;top:30%}50%{left:calc(100% - 34px);top:calc(100% - 24px);transform:none}53%{transform:scale(.85)}56%,100%{left:calc(100% - 34px);top:calc(100% - 24px);transform:none}}
@keyframes fwb{0%,52%{box-shadow:0 0 0 0 var(--accent-soft)}55%{box-shadow:0 0 0 6px var(--accent-soft)}62%,100%{box-shadow:0 0 0 0 transparent}}
@keyframes fwl{0%,58%{opacity:0;transform:scale(.6)}64%,100%{opacity:1;transform:none}}
.fv-pr{display:grid;gap:10px;padding:16px 18px;align-content:center;place-items:stretch}
.fpr-p{font-family:var(--font-display);font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:8px;padding:8px 10px}
.fpr-r{display:grid;gap:6px}

.fpr-r span:nth-child(2){animation-delay:.6s}.fpr-r span:nth-child(3){animation-delay:1.2s}
.fpr-r b{flex:1;height:6px;border-radius:3px;background:var(--cvg1)}

.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px;background:var(--bg)}

.tip-h{font-size:17px;font-weight:600}

@media (max-width:900px){.home-2{grid-template-columns:1fr}}

.rcard .th{height:180px}
.th .fv-art{padding:12px 14px;gap:7px 0}.th .fa-sheet,.th .fa-dash{min-height:0;padding:7px 8px;gap:4px}.th .fa-sheet i:nth-child(n+4){display:none}.th .fa-bars{height:34px}.th .fa-ai small{display:none}
/* article figures */
.r-h{font-family:var(--font-display);font-size:24px;font-weight:600;margin-top:8px}
.flow,.views{margin:4px 0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:20px 18px 12px;font-family:var(--font-body)}

.fn{background:var(--bg);border:1px solid var(--line-2);border-radius:12px;padding:12px;display:grid;gap:2px;justify-items:start;font-size:14.5px;line-height:1.3}

.fl span{position:absolute;font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}

.nogo{grid-area:no;justify-self:start;align-self:center;display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--brown);border:1.5px dashed var(--brown);border-radius:999px;padding:5px 11px;background:var(--bg)}

.views{background:var(--bg);padding:16px 18px}
.views-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.views figcaption{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.vw{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:12px;font-size:14px;line-height:1.4;animation:slidein .3s ease both}
.vw-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.vw-h span{color:var(--muted);font-size:13px}
.vw-k{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

function cover(cv,extra){const [c,icon,v]=cv;const shapes=[
 '<circle class="s1" cx="268" cy="14" r="96"/><circle class="s2" cx="28" cy="170" r="76"/><rect class="s3" x="150" y="106" width="128" height="12" rx="6"/><rect class="s3" x="150" y="126" width="84" height="12" rx="6"/><circle class="s4" cx="118" cy="50" r="9"/>',
 '<rect class="s1" x="170" y="-40" width="180" height="180" rx="40" transform="rotate(18 260 50)"/><circle class="s2" cx="300" cy="150" r="42"/><rect class="s3" x="120" y="34" width="96" height="12" rx="6"/><circle class="s4" cx="92" cy="40" r="7"/><circle class="s4" cx="200" cy="120" r="5"/>',
 '<path class="s1" d="M0 120 C80 70 160 160 320 80 V160 H0z"/><circle class="s2" cx="250" cy="44" r="30"/><circle class="s3" cx="190" cy="66" r="12"/><circle class="s4" cx="300" cy="18" r="6"/>'][v];
 return `<div class="cover cv-${c} ${extra||''}" aria-hidden="true"><svg viewBox="0 0 320 160" preserveAspectRatio="xMidYMid slice">${shapes}</svg><span class="cv-ic">${ic(icon,'lg')}</span></div>`}
function rxBtn(scope,id,o,k,sm){const r=RX.find(x=>x[0]===k);const n=o.rx[k]||0;const on=o.my.has(k);
 return `<button type="button" class="rx${sm?' sm':''}" data-act="react" data-scope="${scope}" data-id="${id}" data-k="${k}" aria-pressed="${on}" aria-label="${r[2]}, ${n}" title="${r[2]}"><span class="e" aria-hidden="true">${r[1]}</span><span class="n">${n}</span></button>`}
function reactBar(scope,id,o){return `<div class="reacts" role="group" aria-label="Reactions">${RX.map(r=>rxBtn(scope,id,o,r[0])).join('')}</div>`}
function toast(msg,icon){const t=$('#toast');t.innerHTML=ic(icon||'check')+'<span>'+esc(msg)+'</span>';t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}

 return `<div class="fv th-rec" aria-hidden="true"><div class="vid"><span class="play">${ic('play','fill')}</span><span class="tl2"><b></b><i style="left:12%"></i><i style="left:37%"></i><i style="left:66%"></i><i style="left:90%"></i></span></div></div>`;
}
function fcard(r,cls){const f=FMT[r.kind];return `<article class="fcard ${cls||''}"><div class="fviz">${featViz(r)}${r.kind==='gif'?'<span class="gifbadge">GIF</span>':''}</div>
 <div class="fbody"><div class="fmeta"><span class="fmt ${f[2]}">${ic(f[1])}${f[0]}</span><span class="tag">${esc(r.uc)}</span></div>

 <div class="rc-f">${av(r.who,'sm')}<span>${esc(first(r.who))} · ${r.min}</span><span class="pc-stats"><span aria-label="${totalRx(r)} reactions"><span class="em" aria-hidden="true">${topEmo(r)}</span> ${totalRx(r)}</span><span aria-label="${ncom(r)} comments">${ic('chat')} ${ncom(r)}</span></span></div></div></article>`}

function ring(v,max,size,label){const r=size/2-7;const c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 ${size} ${size}" role="img" aria-label="${v} of ${max}"><circle class="rb" cx="${size/2}" cy="${size/2}" r="${r}"/><circle class="rf" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" data-off="${(c*(1-v/max)).toFixed(1)}"/><text x="50%" y="50%">${label}</text></svg>`}

function filteredProjects(){const q=S.q.trim().toLowerCase();return projects.filter(p=>!p.draft&&(!S.fTags.size||p.tags.some(t=>S.fTags.has(t)))&&(!S.fStages.size||S.fStages.has(p.stage))&&(!q||(p.title+' '+p.summary+' '+P[p.who].n+' '+p.tags.join(' ')).toLowerCase().includes(q)))}

const DUR=58;
const fmtMin=m=>{const s=Math.round(m*60);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const curChap=()=>{let k=0;CHAP.forEach((c,i)=>{if(S.rec.min>=c.m)k=i});return k};
function vRec(r){
 return `<div class="detail" style="max-width:1100px">${resHead(r)}
 <div class="rec"><div><div class="player"><div class="stagev" id="rstage"></div>

   <div class="livechat"><h2 class="h2" style="margin:0">From the live chat</h2><ul id="rchat" aria-live="polite"></ul></div></div></div>
 ${resFoot(r)}</div>`;
}
function recUpdate(force){const st=$('#rstage');if(!st)return;const k=curChap();const c=CHAP[k];
 $('#rfill').style.width=(S.rec.min/DUR*100)+'%';$('#rtime').textContent=fmtMin(S.rec.min)+' / '+DUR+':00';
 if(force||st.dataset.k!==String(k)){st.dataset.k=k;st.innerHTML=`<span class="live">Recorded Thu, Nov 5</span><div class="slide"><span class="sic">${ic(c.icon)}</span><h3>${esc(c.t)}</h3><p>${esc(c.s)}</p></div>`;
  $('#rtr').textContent=c.tr;$('#rchat').innerHTML=c.chat.map(m=>`<li>${av(m[0],'sm')}<span><b>${esc(first(m[0]))}</b> ${esc(m[1])}</span></li>`).join('');
  $$('#rchaps button').forEach((b,i)=>b.setAttribute('aria-current',String(i===k)))}
 const b=$('#rec-btn');b.innerHTML=S.rec.playing?ic('pause'):ic('play','fill');b.setAttribute('aria-label',S.rec.playing?'Pause recording':'Play recording')}
function recPlay(on){clearInterval(S.rec.timer);S.rec.playing=on;if(on){if(S.rec.min>=DUR)S.rec.min=0;S.rec.timer=setInterval(()=>{if(!$('#rstage')){clearInterval(S.rec.timer);return}S.rec.min=Math.min(DUR,S.rec.min+.5);if(S.rec.min>=DUR){S.rec.playing=false;clearInterval(S.rec.timer)}recUpdate()},250)}recUpdate()}

function cardHTML(kind,id,from='chat'){if(kind==='r'){const r=findR(id);const f=FMT[r.kind];return `<button type="button" class="mcard" data-act="open-res" data-id="${r.id}" data-from="${from}"><span class="mci ${r.kind==='gif'||r.kind==='prompt'?'g':r.kind==='article'?'n':''}">${ic(f[1],'lg')}</span><span><b>${esc(r.title)}</b><span>${f[0]} · ${esc(first(r.who))}</span></span></button>`}

function pollHTML(m){const p=m.poll;const tot=p.opts.reduce((a,o)=>a+o[1],0);return `<div class="poll" role="group" aria-label="Poll: ${esc(p.q)}"><p class="poll-q">${ic('poll')}${esc(p.q)}</p>${p.opts.map((o,i)=>{const pc=Math.round(o[1]/tot*100);return `<button type="button" class="popt" data-act="vote" data-id="${m.id}" data-i="${i}" aria-pressed="${p.voted===i}"><i style="width:${p.voted!=null?pc:0}%"></i><span>${esc(o[0])}</span><b>${p.voted!=null?pc+'%':''}</b></button>`}).join('')}<small>${tot} votes${p.voted!=null?' · You voted':' · Tap an answer to vote'}</small></div>`}
function msgHTML(m,fresh){const p=P[m.who];return `<div class="msg${fresh?' in':''}" id="m-${m.id}">${av(m.who)}<div><div class="mh"><b>${esc(m.who==='me'?'You':p.n)}</b>${p.coach?'<span class="role">Coach</span>':''}<span>${esc(m.t)}</span></div>${m.text?`<p class="mt">${fmtText(m.text)}</p>`:''}${m.card?cardHTML(m.card[0],m.card[1]):''}${m.poll?pollHTML(m):''}${msgRx(m)}</div></div>`}
function vChat(){

   <p class="chans-h">Online now</p><div class="online">${['rw','am','pn','lo','go','dh'].map(id=>av(id,'sm')).join('')}</div></nav>

     <span class="popwrap"><button type="button" class="ibtn" data-act="pop" data-pop="pop-emo" aria-expanded="false" aria-controls="pop-emo" aria-label="Insert emoji">${ic('smile')}</button><span class="pop emo" id="pop-emo" hidden>${['👏','💡','❓','🎉','👀','✅'].map(e=>`<button type="button" data-act="emo-ins" data-e="${e}" aria-label="Insert ${e}">${e}</button>`).join('')}</span></span></div>

    <button class="send" type="submit" aria-label="Send">${ic('send')}</button></form>
  </section></div>`;
}

function addMsg(chId,m){channels[chId].msgs.push(m);if(S.view==='chat'&&!S.detail&&S.chan===chId){$('#msgs').insertAdjacentHTML('beforeend',msgHTML(m,true));scrollMsgs()}else if(chId==='cohort'&&S.view==='home'&&!S.detail&&$('#hchat')){const h=$('#hchat');h.insertAdjacentHTML('beforeend',hmsgHTML(m,true));while(h.children.length>4)h.firstElementChild.remove()}else{channels[chId].unread++;renderNav()}}

 setTimeout(()=>{const tyh=`<div class="typing">${av(who,'sm')}<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>${esc(first(who))} is typing</span></div>`;const ty=$('#typing');if(ty&&S.chan===chId&&S.view==='chat')ty.innerHTML=tyh;const hy=$('#htyping');if(hy&&chId==='cohort'&&S.view==='home'&&!S.detail)hy.innerHTML=tyh;

function goalHTML(g){const d=g.steps.filter(s=>s[1]).length;return `<div class="goal" id="goal-${g.id}">${ring(d,g.steps.length,56,d+'/'+g.steps.length)}<div><h3>${esc(g.title)}</h3><ul class="steps">${g.steps.map((s,i)=>`<li><label><input type="checkbox" data-goal="${g.id}" data-i="${i}" ${s[1]?'checked':''}><span>${esc(s[0])}</span></label></li>`).join('')}</ul></div></div>`}
function tmHTML(m,fresh){return `<div class="tm ${m.who==='me'?'me':''}${fresh?' in':''}">${av(m.who)}<div><div class="tbub">${esc(m.text)}</div><small>${m.who==='me'?'You':esc(first(m.who))} · ${esc(m.t)}</small></div></div>`}
function bookHTML(){if(coach.booked){const s=SLOTS[coach.booked];return `<div class="booked">${ic('check')}<div><b>${s[0]}, ${s[1]}</b><br><span class="muted" style="font-size:13.5px">Booked with Renee. A video link arrives the day before.</span></div></div><button class="btn quiet" type="button" data-act="rebook">Change time</button>`}
 return `<p class="flab" id="slots-l">Pick a time for session 4</p><div class="slots" role="group" aria-labelledby="slots-l">${SLOTS.map((s,i)=>`<button type="button" class="slot" data-act="slot" data-i="${i}" aria-pressed="${coach.slot===i}">${s[1].replace(' PT','')}<span>${s[0]} · PT</span></button>`).join('')}</div><button class="btn primary" type="button" data-act="book" ${coach.slot==null?'disabled':''}>${ic('cal','sm')}Book this time</button>`}
function snoteHTML(){const s=coach.sessions[coach.sel];
 if(s.up)return `<div class="snote card" id="snote"><div><h3>${coach.booked!=null?'Booked: '+SLOTS[coach.booked][0]+', '+SLOTS[coach.booked][1]:'Not booked yet'}</h3><p class="muted">${coach.booked!=null?'Bring your first update and one question about your chart.':'Pick a time above to book your next session with Renee.'}</p></div></div>`;
 return `<div class="snote card" id="snote"><div><h3>${esc(s.title)}</h3><p>${esc(s.notes)}</p><blockquote>${esc(s.q)}</blockquote></div><div><p class="h2" style="margin-bottom:10px">Agreed next steps</p><ul>${s.next.map(n=>`<li>${ic('check')}<span>${esc(n)}</span></li>`).join('')}</ul></div></div>`}
function strackHTML(){return coach.sessions.map((s,i)=>`<li class="${s.up?'up':''}"><button type="button" data-act="session" data-i="${i}" aria-pressed="${coach.sel===i}"><span class="sd">${s.up?ic('cal'):ic('check')}</span><b>${s.k}</b><span>${s.up&&coach.booked!=null?SLOTS[coach.booked][0].replace(/^\w+, /,''):s.d}</span></button></li>`).join('')}
function vCoaching(){
 return vh('Coaching','Your goals, your sessions with a coach, and a private line for questions between sessions.')+`

  <div class="coach-col">
