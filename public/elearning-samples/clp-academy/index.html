}
function coachReply(text){const t=text.toLowerCase();
 if(/stuck|chart|graph/.test(t))return 'Try this: write the one sentence first, then pick the chart that proves it. Send me the sentence and I will react before Thursday.';
 if(/draft|review|update/.test(t))return 'Happy to. Post it to your project page and I will leave comments there so the cohort can learn from them too.';
 if(/win|worked|great/.test(t))return 'Love this. Would you share it in #cohort-4? Others are working on the same problem.';
 return 'Good question. Let\'s make it the first thing we cover in session 4. Jot down what you have tried so far.'}

const LEARNERS={me:{posted:false},am:{posted:true},tb:{posted:false}};
const DATA={weekly:{range:'Nov 11 to 17',k:[['Active learners','21','of 24',''],['Project updates','17','+5 vs last week','up'],['Comments','64','+12 vs last week','up'],['Coaching messages','9','same as last week','flat']],days:['Wed','Thu','Fri','Sat','Sun','Mon','Tue'],p:[3,6,2,0,1,4,1],c:[8,14,9,2,3,17,11]},
 daily:{range:'Tuesday, Nov 17',k:[['Active learners','14','of 24',''],['Project updates','1','+1 vs Monday','up'],['Comments','11','-6 vs Monday','flat'],['Coaching messages','2','+1 vs Monday','up']],days:['8a','10a','12p','2p','4p','6p','8p'],p:[0,1,0,0,0,0,0],c:[1,3,2,1,2,1,1]}};
const NUDGES=[['tb','No project update in 2 weeks','Hi Tom, I loved your onboarding platform idea. Would you post a quick update by Thursday? Even one sentence on how your first new tutors used it would help the cohort.'],['hk','Has not opened Week 5 yet','Hi Hannah, this week\'s featured pieces fit your career mobility project well. Start with the dashboard article in Resources. It answers the student data question.'],['sp','Joined late, no project yet','Hi Sam, welcome! The fastest start is to browse the gallery and pick one project close to yours. Renee can help you choose a first idea.']];

 if(k==='feat'){const p=findP(S.dfeat);return `<section class="nl-sec in" ${st}>${src}<h3>Featured project</h3><div class="nl-feat">${cover(p.cv)}<div class="b"><b style="font-size:17px">${esc(p.title)}</b><p class="muted" style="font-size:14px">${esc(p.summary)}</p><span class="pc-stats"><span><span class="em">${topEmo(p)}</span> ${totalRx(p)} reactions</span><span>${ic('chat')} ${ncom(p)}</span></span></div></div><span class="nl-cta">Read ${esc(first(p.who))}'s project</span></section>`}
 if(k==='res'){const r=findR('r1');return `<section class="nl-sec in" ${st}>${src}<h3>${esc(r.title)}</h3><p class="muted">${FMT[r.kind][0]} by ${esc(P[r.who].n)} · ${totalRx(r)} reactions this week</p></section>`}
 if(k==='quote')return `<section class="nl-sec in" ${st}>${src}<p class="nl-quote">"Check three rows by hand before you trust any total."</p><p class="nl-who">${av('rw','sm')}Renee in #week-5</p></section>`;
 if(k==='shout')return `<section class="nl-sec in" ${st}>${src}<h3>First-time posters</h3><div class="nl-who" style="margin-top:4px"><span class="avs">${['go','lo','hk'].map(x=>av(x,'sm')).join('')}</span>Grace, Luis and Hannah shared their first updates.</div></section>`;
 return `<section class="nl-sec in" ${st}>${src}<h3>Coming up</h3><p>Thursday, 11:00 AM PT: Spotlight Session #2. Bring one question about your project.</p></section>`}
function newsletter(){const on=DSRC.filter(d=>S.dsec[d[0]]).map(d=>d[0]);
 return `<div class="email-meta"><span><b>To:</b> ${esc(P[S.dwho].n)} · one of 24 learners</span><span><b>Subject:</b> Week 5: from ideas to evidence</span></div><div class="nl"><div class="nl-hero"><small>Cohort 4 Weekly · Issue 5</small><h2>From ideas to evidence</h2><p>${ic('cal','sm')}Tuesday, Nov 17 · Built from this week's course activity</p></div>${on.length?on.map((k,i)=>nlSec(k,i)).join(''):'<div class="nl-sec"><p class="muted">Choose at least one section to include.</p></div>'}</div>`}

function instructor(){const d=DATA[S.dfreq];
 return `<div class="kpis">${d.k.map(k=>`<div class="kpi"><span>${k[0]}</span><b>${k[1]}</b><small class="${k[3]==='up'?'':'flat'}">${k[3]==='up'?ic('up'):''}${k[2]}</small></div>`).join('')}</div>
 <div class="dgrid"><div class="card chartbox"><h3>Activity <span>${d.range}</span></h3><div class="chart">${chart(d)}</div><div class="legend"><span><i style="background:var(--accent)"></i>Project updates</span><span><i style="background:var(--green)"></i>Comments</span></div></div>
 <div class="card dlist"><h3>Needs a nudge <span>${NUDGES.length} learners</span></h3><ul>${NUDGES.map((n,i)=>`<li class="nudge">${av(n[0])}<div><b>${esc(P[n[0]].n)}</b><span>${esc(n[1])}</span></div><button class="btn quiet" type="button" data-act="nudge" data-i="${i}" aria-expanded="${S.nudge===i}">${S.nudge===i?'Hide':'Draft a nudge'}</button>${S.nudge===i?`<div class="draft"><p id="nd-${i}">${esc(n[2])}</p><div><button class="btn" type="button" data-act="copy-nudge" data-i="${i}">${ic('copy','sm')}Copy text</button></div></div>`:''}</li>`).join('')}</ul></div></div>
 <div class="card dlist" style="margin-top:18px"><h3>Most reacted this week</h3><ol class="top3" style="list-style:none;margin:0;padding:0">${[['p','p1'],['r','r1'],['p','p3']].map((x,i)=>{const o=getItem(x[0],x[1]);return `<li><b>${i+1}</b><button type="button" class="linkbtn" style="font-size:14.5px;text-align:left" data-act="${x[0]==='p'?'open-project':'open-res'}" data-id="${o.id}">${esc(o.title)}</button><span>${topEmo(o)} ${totalRx(o)}</span></li>`}).join('')}</ol></div>`}
function vDigest(){
 const news=S.dmode==='news';
 const side=news?`<div class="dside"><div><h2>Sections</h2><ul class="srcs">${DSRC.map(d=>`<li><label><input class="cbx" type="checkbox" data-dsec="${d[0]}" ${S.dsec[d[0]]?'checked':''}><span class="si ${d[4]}">${ic(d[3])}</span><span>${d[1]}<small>From ${d[2]}</small></span></label></li>`).join('')}</ul></div>

  <div class="field"><label for="d-who">Preview as</label><select id="d-who">${Object.keys(LEARNERS).map(k=>`<option value="${k}" ${S.dwho===k?'selected':''}>${esc(P[k].n)} (${LEARNERS[k].posted?'posted this week':'has not posted'})</option>`).join('')}</select></div>
  <p class="aud">${ic('users','sm')}<span>Sends to <b>24 learners</b> Tuesdays at 8 AM, personalized for each</span></p>
  <button class="btn" type="button" data-act="d-rebuild">${ic('refresh','sm')}Rebuild from this week</button></div>`
 :`<div class="dside"><div><h2>How often</h2><div class="chips" role="group" aria-label="Digest frequency">${[['weekly','Weekly'],['daily','Daily']].map(f=>`<button type="button" class="chip" data-act="d-freq" data-v="${f[0]}" aria-pressed="${S.dfreq===f[0]}">${ic('check')}${f[1]}</button>`).join('')}</div></div><p class="aud">${ic('mail','sm')}<span>Goes to <b>you and your co-facilitator</b>. Learners never see it.</span></p></div>`;

function renderView(keepScroll){
 stopTimers();
 const v=$('#view');let html;
 if(S.detail){if(S.detail.type==='p')html=vProject(S.detail.id);else{const r=findR(S.detail.id);html={article:vArticle,walk:vWalk,gif:vGif,prompt:vPrompt,rec:vRec}[r.kind](r)}}

 v.innerHTML=html;v.classList.remove('enter');void v.offsetWidth;if(!RM)v.classList.add('enter');
 renderNav();
 $('#rprog').hidden=!(S.detail&&S.detail.type==='r'&&findR(S.detail.id).kind==='article');

function after(){
 raf(()=>{$$('[data-w]').forEach(e=>{if(!e.closest('.g-bars'))e.style.width=e.dataset.w+'%'});$$('.rf[data-off]').forEach(c=>c.style.strokeDashoffset=c.dataset.off);$$('.spark i[data-h]').forEach(i=>i.style.height=i.dataset.h+'%')});
 if($('#msgs'))scrollMsgs();
 if($('#tmsgs')){const t=$('#tmsgs');t.scrollTop=t.scrollHeight}
 if($('#wcur'))moveCursor();
 if($('#gif')){if(RM||S.still)gifFinal();else gifPlay(true,true)}

function go(v,opts){if(!VIEWS.includes(v))v='home';S.view=v;S.detail=null;S.hlOpen=null;try{if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v)}catch(e){}
 renderView();window.scrollTo(0,0);if(!(opts&&opts.noFocus)){const h=$('#view h1');if(h)h.focus({preventScroll:true})}}
function openProject(id,from){S.detail={type:'p',id,from:from||S.view,scroll:window.scrollY};renderView();window.scrollTo(0,0);const h=$('#view h1');if(h)h.focus({preventScroll:true})}
function openRes(id,from){const r=findR(id);S.detail={type:'r',id,from:from||S.view,scroll:window.scrollY};S.hlOpen=null;S.gif.f=0;if(r.kind==='walk'){S.walk=0;S.walkPrev=0}if(r.kind==='rec'){S.rec.min=0}renderView();window.scrollTo(0,0);const h=$('#view h1');if(h)h.focus({preventScroll:true})}

 reply:f=>{const t=f.querySelector('textarea');const v=t.value.trim();if(!v){t.focus();return}const o=getItem(f.dataset.scope,f.dataset.id);const c=o.comments.find(x=>x.id===f.dataset.cid);const r=C('me',v,'Just now');c.replies.push(r);

 hchat:f=>{const t=$('#hchat-in');const v=t.value.trim();if(!v){t.focus();return}t.value='';addMsg('cohort',M('me',nowT(),v,{}));peerReply('cohort');t.focus()},
 chat:f=>{const t=$('#chat-in');const v=t.value.trim();if(!v){t.focus();return}t.value='';t.style.height='';addMsg(S.chan,M('me',nowT(),v,{}));peerReply(S.chan);t.focus()},
 coach:f=>{const t=$('#coach-in');const v=t.value.trim();if(!v){t.focus();return}t.value='';const m={who:'me',text:v,t:nowT()};coach.thread.push(m);const box=$('#tmsgs');box.insertAdjacentHTML('beforeend',tmHTML(m,true));box.scrollTop=box.scrollHeight;
  setTimeout(()=>{const ty=$('#ctyping');if(ty)ty.innerHTML=`<div class="typing" style="padding:0 18px 8px">${av('rw','sm')}<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>Renee is typing</span></div>`;
   setTimeout(()=>{const ty2=$('#ctyping');if(ty2)ty2.innerHTML='';const r={who:'rw',text:coachReply(v),t:nowT()};coach.thread.push(r);const bx=$('#tmsgs');if(bx){bx.insertAdjacentHTML('beforeend',tmHTML(r,true));bx.scrollTop=bx.scrollHeight}else toast('Renee replied','chat')},1700)},600);t.focus()},
 update:f=>{const ti=$('#u-title'),bo=$('#u-body');if(!ti.value.trim()||!bo.value.trim()){$('#u-err').textContent='Add a title and a sentence about what happened.';(ti.value.trim()?bo:ti).focus();return}
  $('#u-err').textContent='';const p=findP('me');const u={t:'Just now',title:ti.value.trim(),body:bo.value.trim()};p.updates.unshift(u);coach.goals[0].steps[1][1]=true;
  const e=$('#tl-empty');if(e)e.remove();$('#tl').insertAdjacentHTML('afterbegin',updHTML(u,true));ti.value='';bo.value='';toast(p.draft?'Update posted. Publish to share it with the gallery.':'Update posted to the gallery')},
 hlnote:f=>{const i=f.querySelector('input');const v=i.value.trim();if(!v){i.focus();return}const h=f.dataset.h;HL[h].notes.push(['me',v]);HL[h].count++;$('#note-'+h).outerHTML=hlNote(h);const b=document.querySelector(`[data-act="hl"][data-h="${h}"] sup`);if(b)b.textContent=HL[h].count;$('#hn-'+h).focus();toast('Note added')},
 publish:f=>{const ti=$('#pf-title').value.trim(),su=$('#pf-sum').value.trim();const tags=$$('[data-act="pf-tag"][aria-pressed="true"]').map(b=>b.dataset.v);const st=(f.querySelector('input[name="pf-stage"]:checked')||{}).value||'Idea';
  if(!ti||!su){$('#pf-err').textContent='Add a title and a summary.';return}if(!tags.length){$('#pf-err').textContent='Pick at least one topic.';return}
  const p=findP('me');Object.assign(p,{title:ti,summary:su,tags,stage:st,draft:false,isNew:true});const i=projects.indexOf(p);projects.splice(i,1);projects.unshift(p);
  $('#modal-root').innerHTML='';S.fTags.clear();S.fStages.clear();S.q='';go('gallery');toast('Published to the gallery','upload');setTimeout(()=>{p.isNew=false},2500)}
};
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();FORM[f.dataset.form](f)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='g-search'){S.q=t.value;refreshGallery()}
 if(t.id==='pr-prog'){S.prProg=t.value;const m=$('#pr-fill');if(m)m.textContent=t.value.trim()||'[describe your program]'}
 if(t.id==='chat-in'){t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.goal){const g=coach.goals.find(x=>x.id===t.dataset.goal);g.steps[+t.dataset.i][1]=t.checked;const ring=$('#goal-'+g.id+' .ring');const tmp=document.createElement('div');const d=g.steps.filter(s=>s[1]).length;tmp.innerHTML=goalHTML(g);const nr=tmp.querySelector('.ring');const rf=nr.querySelector('.rf');const old=ring.querySelector('.rf');rf.style.strokeDashoffset=old.style.strokeDashoffset||old.getAttribute('stroke-dashoffset');ring.replaceWith(nr);raf(()=>rf.style.strokeDashoffset=rf.dataset.off);if(d===g.steps.length)toast('Goal complete','check')}
 if(t.dataset.dsec){S.dsec[t.dataset.dsec]=t.checked;$('#nl').innerHTML=newsletter()}
 if(t.id==='d-feat'){S.dfeat=t.value;$('#nl').innerHTML=newsletter()}
 if(t.id==='d-who'){S.dwho=t.value;$('#nl').innerHTML=newsletter()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('#modal-root').innerHTML){closeModal();return}const open=$('.pop:not([hidden])');if(open){const b=document.querySelector(`[aria-controls="${open.id}"]`);closePops();if(b)b.focus();return}if(S.tour){S.tour=null;tourRender();tourMark();return}}
 if(e.key==='Tab'&&$('#modal-root').innerHTML){const m=$('#modal-root .modal');const f=$$('button:not([disabled]),input:not([type="radio"]),input[type="radio"]:checked,textarea,select,[tabindex]:not([tabindex="-1"])',m);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
 if(e.key==='Enter'&&!e.shiftKey&&(e.target.id==='chat-in'||e.target.id==='coach-in')){e.preventDefault();e.target.form.requestSubmit?e.target.form.requestSubmit():e.target.form.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}))}
 if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.closest&&e.target.closest('#walk')&&!/INPUT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();walkSet(S.walk+(e.key==='ArrowRight'?1:-1));const nb=$('#wside .btn.primary');if(nb)nb.focus()}
});
window.addEventListener('scroll',()=>{const p=$('#rprog');if(p.hidden)return;const a=$('.reader');if(!a)return;const r=a.getBoundingClientRect();const tot=r.height-window.innerHeight;const pc=tot>0?Math.min(100,Math.max(0,-r.top/tot*100)):100;p.firstElementChild.style.width=pc+'%'},{passive:true});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&(h!==S.view||S.detail))go(h)});

/* boot */
const h0=(location.hash||'').slice(1);S.view=VIEWS.includes(h0)?h0:'home';
renderView();
let seen=false;try{seen=localStorage.getItem('clp-academy-tour')==='1';localStorage.setItem('clp-academy-tour','1')}catch(e){}
if(!seen){S.tour={welcome:true};tourRender()}
window.__academy={S,projects,resources,channels,coach,go,openProject,openRes};
})();
